connus (aucun acte de mariage dans la base ; union attestée par [A0429])\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0035.\n", "PN0036": "# Clovis CHARLEMAGNE\n\n*personne citée dans l'enquête*\n\n## En bref\n\nClovis Charlemagne, rentier au Mesnil-sur-Oger, est témoin du mariage de Louis Auguste Leblanc et de Marguerite Belloy en 1900. L'acte le dit « aïeul maternel de l'épouse » et lui donne 73 ans, chiffre marqué d'un doute. Il serait donc le père de Louise Adèle Charlemagne, mais ce lien n'est pas écrit dans l'acte. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0036.\n", "PN0037": "# Gustave CHARLEMAGNE\n\n*personne citée dans l'enquête*\n\n## En bref\n\nGustave Charlemagne, 30 ans, propriétaire au Mesnil-sur-Oger, est témoin du mariage de Louis Auguste Leblanc et de Marguerite Belloy en 1900. L'acte le dit oncle maternel de l'épouse. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0037.\n", "PN0038": "# Louis Aristide LEBLANC\n\n*personne citée dans l'enquête*\n\n## En bref\n\nLouis Aristide Leblanc, 49 ans, cultivateur à Compertrix (Marne), est témoin du mariage de son neveu Louis Auguste Leblanc en 1900 ; l'acte le dit oncle paternel de l'époux. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0038.\n", "PN0039": "# Joseph ISOUX [?]\n\n*personne citée dans l'enquête*\n\n## En bref\n\nJoseph Isoux, nom à relire, a 57 ans et est matelassier à Paris. Il est témoin du mariage de Louis Auguste Leblanc en 1900 et l'acte le dit oncle maternel de l'époux. Son nom n'est pas celui de la mère de l'époux, Oudot, et rien ne l'explique : lecture erronée, ou oncle par alliance, sont deux possibilités à vérifier sur l'image. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0039.\n", "PN0040": "# Charles MARY\n\n*personne citée dans l'enquête*\n\n## En bref\n\nCharles Mary, 40 ans, est inscrit au dénombrement de Châlons-sur-Marne en 1901, à la suite du ménage de Louis Auguste Leblanc, avec Eugène Bilger et Louise Gobillard. Son rattachement à l'établissement Leblanc n'est pas explicite, car la colonne de droite est coupée ; il pourrait aussi relever d'un autre débit. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0040.\n", "PN0041": "# Eugène BILGER\n\n*personne citée dans l'enquête*\n\n## En bref\n\nEugène Bilger, 17 ans, « garçon limonadier », est inscrit au dénombrement de Châlons-sur-Marne en 1901 à la suite du ménage de Louis Auguste Leblanc, avec Charles Mary et Louise Gobillard. Son rattachement à l'établissement Leblanc n'est pas explicite, car la colonne de droite est coupée ; il pourrait relever d'un autre débit. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0041.\n", "PN0042": "# Louise GOBILLARD\n\n*personne citée dans l'enquête*\n\n## En bref\n\nLouise Gobillard, 20 ans, servante, est inscrite au dénombrement de Châlons-sur-Marne en 1901 à la suite du ménage de Louis Auguste Leblanc, avec Charles Mary et Eugène Bilger. Son rattachement à l'établissement Leblanc n'est pas explicite, car la colonne de droite est coupée ; elle pourrait relever d'un autre débit. On ne sait rien d'autre d'elle.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0042.\n", "PN0043": "# Auguste BELLOY\n\n*personne citée dans l'enquête*\n\n## En bref\n\nSelon sa feuille matricule (classe 1873), un Auguste Belloy est né le 13/10/1853 à Lafrancheville (canton de Mézières, Ardennes). Il est jardinier et réside à Paris. Il est dit fils de Jean-Baptiste Belloy et de Marie Esther Goutant, domiciliés à Jandun ; l'acte de naissance n'a pas été lu. Il part le 11/08/1874 pour le 5e régiment d'artillerie. D'après la fiche, il est nommé sous-lieutenant de réserve au 29e régiment d'artillerie en 1879 et rayé des cadres en 1897. Cette carrière est inhabituelle pour un jardinier : homonyme ou erreur de lecture possibles. …\n\n## Faits clés\n\n- **Naissance** : 13/10/1853, Lafrancheville — *vérifié* [A0444]\n- **Parents** : Jean-Baptiste BELLOY (PN0044) et Marie Esther GOUTANT (PN0045) — *vérifié* [A0445]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0043.\n", "PN0044": "# Jean-Baptiste BELLOY\n\n*personne citée dans l'enquête*\n\n## En bref\n\nJean-Baptiste Belloy est dit père d'un Auguste Belloy, né le 13/10/1853, sur la feuille matricule de ce dernier. Il est alors domicilié à Jandun (canton de Signy-l'Abbaye, Ardennes), avec sa femme Marie Esther Goutant. La filiation est déclarée et l'acte de naissance n'a pas été lu. Si cet Auguste est le père de Marguerite Belloy, ce qui n'est qu'une hypothèse, Jean-Baptiste serait son grand-père. On ne connaît ni son mariage, ni sa naissance, ni son décès.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Marie Esther GOUTANT (PN0045) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0044.\n", "PN0045": "# Marie Esther GOUTANT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nMarie Esther Goutant est dite mère d'un Auguste Belloy, né le 13/10/1853, sur la feuille matricule de ce dernier. Elle est alors domiciliée à Jandun (canton de Signy-l'Abbaye, Ardennes), avec son mari Jean-Baptiste Belloy. La filiation est déclarée et l'acte de naissance n'a pas été lu. Aucun acte de mariage n'est dans la base. Si cet Auguste est le père de Marguerite Belloy, ce qui n'est qu'une hypothèse, elle serait l'arrière-grand-mère de Luce Renée Leblanc. On ne connaît ni sa naissance, ni son décès.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Jean-Baptiste BELLOY (PN0044) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0045.\n", "PN0046": "# Alfred GASNIER\n\n*personne citée dans l'enquête*\n\n## En bref\n\nAlfred Gasnier est le père de Solange Gasnier, qui épouse Léon Dubart en 1923. L'acte de mariage le dit père, avec Solange Minois, mère ; ils sont décédés à la date de l'acte. La fiche porte aussi la mention « 1923 » pour ces décès, ce qui reste à éclaircir. Ses parents sont absents de l'arbre et aucun acte de naissance n'a été lu. On ne connaît ni sa naissance, ni son métier, ni la date précise de son décès.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Solange MINOIS (PN0047) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0046.\n", "PN0047": "# Solange MINOIS\n\n*personne citée dans l'enquête*\n\n## En bref\n\nSolange Minois est la mère de Solange Gasnier, qui épouse Léon Dubart en 1923. L'acte de mariage de sa fille la dit épouse d'Alfred Gasnier ; tous deux sont décédés à la date de l'acte. La fiche porte aussi la mention « 1923 » pour ces décès, ce qui reste à éclaircir. Aucun acte de naissance n'a été lu. On ne connaît ni sa naissance, ni son métier, ni la date précise de son décès.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Alfred GASNIER (PN0046) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0047.\n", "PN0048": "# Jean Baptiste LAFORGUE\n\n*personne citée dans l'enquête*\n\n## En bref\n\nJean Baptiste Laforgue est le premier époux de Solange Gasnier. En 1923, l'acte de mariage de celle-ci avec Léon Dubart la dit veuve de Jean Baptiste Laforgue depuis le 27/05/1908 ; elle est alors sans profession et domiciliée 10 rue de Madagascar, à Paris. Le lieu de son décès n'est pas indiqué. On ne sait rien d'autre de lui : ni sa naissance, ni son métier, ni la date de son mariage avec Solange.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Solange GASNIER (P5241) — date et lieu inconnus (aucun acte de mariage dans la base ; union attestée par [A0462])\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0048.\n", "PN0049": "# Léonce BOCAHUT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nLéonce Bocahut, commerçant, domicilié 72 bis rue d'Amsterdam, est l'un des deux témoins du mariage de Léon Dubart et de Solange Gasnier, à Paris, en 1923. L'autre témoin est un Louis Leblanc, de Vincennes. L'acte ne dit pas son lien avec les époux. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0049.\n", "PN0050": "# Louis LEBLANC\n\n*personne citée dans l'enquête*\n\n## En bref\n\nLouis Leblanc, représentant, décoré de la Croix de Guerre, domicilié à Vincennes, 3 rue Villebois-Mareuil, est témoin du mariage de Léon Dubart et de Solange Gasnier, en 1923. L'autre témoin est Léonce Bocahut. L'adresse est celle de Louis Auguste Leblanc, beau-père de René Dubart, qui y vit avec sa famille en 1922. La qualité de négociant en 1922 est différente de celle-ci. Hypothèse : le témoin serait Louis Auguste Leblanc lui-même, mais l'identification n'est pas démontrée. Il pourrait s'agir d'un autre membre de la famille Leblanc vivant à la même adresse. …\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0050.\n", "PN0051": "# Annie Marguerite Jeannine DUBART\n\n*fille de René DUBART*\n\n## En bref\n\nAnnie Marguerite Jeannine Dubart naît le 09/12/1930 à 17 h, boulevard du Château n° 37, à Neuilly-sur-Seine. L'acte la dit fille de René Dubart, ingénieur, né le 19/01/1900 à Paris 2e, et de Luce Renée Leblanc, née le 24/01/1901 à Châlons-sur-Marne. Ses parents sont domiciliés à Clichy, 8 avenue Gambetta ; l'acte ne dit pas pourquoi elle naît à Neuilly. Son père déclare la naissance le 10/12/1930 devant un adjoint au maire de Neuilly. Elle est donc la petite-fille de Léon Dubart et de Jeanne Augustine Baron Marchal d'un côté, de Louis Auguste Leblanc et de Marguerite Belloy de l'autre.\n\n## Faits clés\n\n- **Naissance** : 09/12/1930, Neuilly-sur-Seine — *vérifié* [A0470]\n- **Parents** : Edouard Jean \"René\" DUBART (P5184) et Luce \"Renée\" LEBLANC (P5187) — *vérifié* [A0471]\n- **Mariage** : avec personne privée (PN0052) — 03/10/1955, Bois-le-Roi — *vérifié* [A0474]\n- **Décès** : 04/03/1998, Neuilly-sur-Seine — *vérifié* [A0475]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0051.\n", "PN0052": "# personne privée (PN0052)\n\nInformations non publiées (vie privée).\n", "PN0053": "# Lucien Charles André DUBART\n\n*personne citée dans l'enquête*\n\n## En bref\n\nLucien Charles André Dubart naît le 15/12/1890 à Paris 17e. Sergent au 4e régiment d'infanterie, il est tué à l'ennemi le 16/04/1917 à Juvincourt (Aisne), et déclaré mort pour la France. Cet état de fait vient d'une transcription, partiellement vérifiée. Il est fils de Maurice Charles Dubart et d'Anna Joséphine Lucie Henriette Vincent, et époux de Henriette Marie Joséphine Motte.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : Maurice Charles DUBART (PN0054) — *partiellement vérifié* [A0476] ; l'autre parent est inconnu\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : 16/04/1917, Juvincourt — *partiellement vérifié* [A0476]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0053.\n", "PN0054": "# Maurice Charles DUBART\n\n*personne citée dans l'enquête*\n\n## En bref\n\nMaurice Charles Dubart est connu comme père de Lucien Charles André Dubart, sergent tué à l'ennemi en 1917 ; il est alors domicilié à Charenton. Il a épousé Anna Joséphine Lucie Henriette Vincent. On ne connaît ni sa naissance, ni son mariage, ni son décès.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : Charles Alfred DUBART (P5762) — *hypothèse* [A0477] ; l'autre parent est inconnu\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0054.\n", "PN0055": "# André Émile François RIGNAULT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nAndré Émile François Rignault est né le 02/02/1886 en Saône-et-Loire (Saint-Jean-de-Vaux ?, lecture incertaine). L'acte le dit fils d'Eugène Émile et de Marie, domiciliés à Marseille, 130 cours Lieutaud, et dessinateur industriel. La source est une transcription, partiellement vérifiée, qui n'écrit aucun lien avec la famille Rignault de Paris.\n\n## Faits clés\n\n- **Naissance** : 02/02/1886, Saône-et-Loire — *partiellement vérifié* [A0478]\n- **Parents** : Eugène RIGNAULT (PN0057) — *vérifié* [A0479] ; Eugène Émile RIGNAULT (PN0056) — *partiellement vérifié* [A0478] — les sources ne s'accordent pas, voir Famille\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0055.\n", "PN0056": "# Eugène Émile RIGNAULT\n\n*fils de Jean RIGNAULT*\n\n## En bref\n\nEugène Émile Rignault naît à Paris, dans le 5e arrondissement d'alors, le 30 mars 1851, d'après une fiche de l'état civil reconstitué ; la fiche ne nomme pas ses parents et l'acte lui-même n'a pas été retrouvé. On le rattache, par hypothèse seulement, à Jean Louis Alexandre Rignault, artiste musicien, et à Adèle Félicie Bosse : il serait alors le frère de Marie Félicie Rignault, que le faire-part de 1918 nomme à côté d'un « Eugène Rignault, son frère ». Le lien n'est pas établi : il pourrait s'agir d'un autre Eugène Rignault, d'un demi-frère ou d'un cousin. …\n\n## Faits clés\n\n- **Naissance** : 30/03/1851, Paris 5e (ancien) — *partiellement vérifié* [A0772]\n- **Parents** : Jean Louis Alexandre RIGNAULT (P5764) et Adèle Félicie BOSSE (P5767) — *hypothèse* [A0773]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0056.\n", "PN0057": "# Eugène RIGNAULT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nEugène Rignault est mort avant le 12/04/1929 : un avis paru ce jour-là dans Le Petit Marseillais, où M. André, Mlles Jane et Cécile Rignault, ses enfants, remercient pour les marques de sympathie reçues lors de son décès. L'avis ne donne ni âge, ni profession, ni parenté. Hypothèse : il serait Eugène Émile Rignault, père d'André Émile François, né en 1886, qui habitait Marseille. Cette identification n'est pas vérifiée et des homonymes sont possibles.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : avant le 12/04/1929, Marseille [?] — *vérifié* [A0479]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0057.\n", "PN0058": "# Charles DUBAR\n\n*personne citée dans l'enquête*\n\n## En bref\n\nCharles Dubar, nom écrit ainsi dans l'acte, est le père d'un Jean baptisé à Elincourt-Sainte-Marguerite un 25 décembre. L'acte le dit fils de Charles Dubar et de Catherine Molin, sa femme. L'année n'est pas lue sur l'image. Le seul nom du fichier familial donne 1685, mais ce n'est pas une date établie. Ni métier, ni âge du père ne sont indiqués. Le rapport avec les Dubart n'est pas établi. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Catherine MOLIN (PN0059) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0058.\n", "PN0059": "# Catherine MOLIN\n\n*personne citée dans l'enquête*\n\n## En bref\n\nCatherine Molin est dite femme de Charles Dubar (nom écrit ainsi) dans l'acte de baptême de leur fils Jean, à Elincourt-Sainte-Marguerite, un 25 décembre. L'année n'est pas lue sur l'image. Le seul nom du fichier familial donne 1685, mais ce n'est pas une date établie. Aucun acte de mariage n'est dans la base. On ne sait rien d'autre d'elle.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Charles DUBAR (PN0058) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0059.\n", "PN0060": "# Eugène MARCHAL\n\n*personne citée dans l'enquête*\n\n## En bref\n\nEugène Marchal, 56 ans, sans profession, domicilié à Vichy, est le premier témoin cité du mariage de 1896 d'Anne Louise Angélique Marchal (mariage Orsay-Marchal). Les autres témoins sont Henri Fichet, Edouard Outmans de Percq et Jules Goy. L'acte ne dit aucun lien de parenté entre lui et la mariée ; un frère ou un cousin n'est pas établi. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0060.\n", "PN0061": "# (Madame, prénom inconnu) DUBART\n\n*personne citée dans l'enquête*\n\n## En bref\n\n« Madame Dubart, professeur de chant » est connue par la presse musicale parisienne, de 1839 à 1846 d'après les articles enregistrés (une dernière mention de 1848 est signalée dans les recherches, sans assertion propre), et par quelques listes d'annuaires qui la rattachent au monde de la musique de 1837 à 1850. Son prénom, son état civil, son mari et son adresse personnelle ne sont pas connus.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0061.\n", "PN0062": "# (pharmacien, prénom inconnu) DUBART\n\n*personne citée dans l'enquête*\n\n## En bref\n\nUn pharmacien nommé Dubart figure rue de Bondy, n° 32, dans l'Almanach des lettres et des arts de 1850 ; les « Dubart » de cet almanach (rue de Bondy, puis rue de Vendôme, n° 11 bis) sont des pharmaciens du conseil médical d'une société d'artistes. Il a été écarté comme homonyme : aucun lien n'est établi avec la famille, ni avec la « Madame Dubart » chanteuse de la presse musicale. Son prénom est inconnu.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0062.\n", "PN0063": "# David BANDERALI\n\n*personne citée dans l'enquête*\n\n## En bref\n\nDavid Banderali est professeur de chant. L'Almanach royal de 1829 le range parmi les professeurs des classes de chant du Conservatoire, rue Neuve-d'Artois, n° 31. Selon la nécrologie de la Revue et gazette musicale du 17 juin 1849, il aurait été appelé à Paris sous la Restauration, aurait vécu ensuite d'une « nombreuse clientèle » de leçons et en aurait perdu toutes en février 1848. Il apparaît ici comme le maître déclaré de « Madame Dubart » dans Le Ménestrel de 1841 ; si elle l'a eu pour professeur à Paris, c'est au plus tôt à partir de 1828, sans que l'on sache quand. …\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0063.\n", "PN0064": "# (homonymes masculins musiciens, prénoms inconnus) GIBERT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nDeux hommes nommés Gibert, musiciens, ont été rencontrés dans la presse musicale : un « M. Gibert, qui chante avec beaucoup de goût » à la Société philharmonique de Bordeaux (1842), et un clarinettiste Gibert, deuxième prix du Conservatoire en 1857 et 1859. Ils ont été écartés comme homonymes ; aucun lien avec la famille n'est établi. Leurs prénoms sont inconnus. Aucune « Mlle Gibert » musicienne n'a été trouvée dans les volumes lus.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0064.\n", "PN0065": "# Adrien FOUCAMPREZ\n\n*arrière-arrière-arrière-grand-père de René, côté paternel*\n\n## En bref\n\nAdrien Foucamprez est connu par un seul document : l'extrait du baptême de sa fille Marie Catherine, à Saint-Sulpice, le 3 mars 1771. Il est alors marié à Catherine Colin, ils demeurent rue du Sépulcre, paroisse Saint-Sulpice, à Paris, et il est présent au baptême. L'extrait ne porte pas sa profession. On ne sait rien de sa naissance, de ses parents, de la date et du lieu de son mariage, ni de sa mort. Le parrain de sa fille porte le même nom que lui, François Étienne Alexis Foucamprez : un frère ou un parent est probable, mais le lien n'est pas dit. …\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Catherine COLIN (PN0066) — avant 1771-03-03, Paris — *vérifié* [A0557]\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0065.\n", "PN0066": "# Catherine COLIN\n\n*arrière-arrière-arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nCatherine Colin est connue par le seul extrait de baptême de sa fille Marie Catherine, à Saint-Sulpice, le 3 mars 1771 : elle y est l'épouse d'Adrien Foucamprez, avec qui elle demeure rue du Sépulcre, à Paris. On ne sait rien de sa naissance, de ses parents, de son mariage (avant mars 1771, date et lieu inconnus) ni de sa mort. Par sa fille Marie Catherine, elle est la grand-mère de Camille Melchior et d'Octavie Gibert.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Adrien FOUCAMPREZ (PN0065) — avant 1771-03-03, Paris — *vérifié* [A0557]\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0066.\n", "PN0067": "# François Étienne Alexis FOUCAMPREZ\n\n*mentionné dans un acte de Marie FOUCAMPREZ*\n\n## En bref\n\nFrançois Étienne Alexis Foucamprez est le parrain de Marie Catherine Foucamprez, baptisée à Saint-Sulpice le 3 mars 1771 ; la marraine est Marie Madeleine Dettous, dite son épouse. Il porte le même nom que le père de l'enfant, Adrien : un frère ou un parent est probable, mais l'acte ne dit pas le lien. On ne sait rien d'autre de lui : ni naissance, ni profession, ni mort.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0067.\n", "PN0068": "# Marie Madeleine DETTOUS [?]\n\n*mentionné dans un acte de Marie FOUCAMPREZ*\n\n## En bref\n\nMarie Madeleine Dettous est la marraine de Marie Catherine Foucamprez, baptisée à Saint-Sulpice le 3 mars 1771 ; elle y est dite épouse du parrain, François Étienne Alexis Foucamprez. Son nom de famille est de lecture incertaine : on peut aussi lire Destous ou Dettons. On ne sait rien d'autre d'elle.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0068.\n", "PN0069": "# Joseph Pierre Bernard CHAUVET\n\n*déclarant dans un acte de Marie FOUCAMPREZ*\n\n## En bref\n\nJoseph Pierre Bernard Chauvet est le second déclarant du décès de Marie Catherine Foucamprez, le 14 septembre 1827 : l'acte le dit négociant, âgé de 38 ans, demeurant 21 rue Poissonnière ; il déclare avec le fils de la défunte, Camille Melchior Gibert. Son lien avec la famille n'est pas dit (voisin, ami, allié ?). On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0069.\n", "PN0070": "# Geneviève GIBERT\n\n*fille de François GIBERT*\n\n## En bref\n\nGeneviève Gibert est baptisée à Saint-Roch, à Paris, le 16 décembre 1744, fille de François Gibert, marchand mercier, et de Marie Jeanne Dolhain, de la rue Saint-Honoré ; son père est présent et signe. Son parrain est Pierre Neveux, marchand de vin, et sa marraine Geneviève Godier ; aucun lien de parenté n'est dit. L'extrait est une pièce de reconstitution de l'état civil, déposée par la « Cie Lafarge ».\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Baptême** : 16/12/1744, Paris, paroisse Saint-Roch, rue Saint-Honoré — *vérifié* [A0571]\n- **Parents** : François GIBERT (PR0036) et Marie DOLHAIN (PR0037) — *vérifié* [A0571]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0070.\n", "PN0071": "# Pierre NEVEUX\n\n*personne citée dans l'enquête*\n\n## En bref\n\nPierre Neveux est marchand de vin ; il est le parrain de Geneviève Gibert, baptisée à Saint-Roch le 16 décembre 1744, avec Geneviève Godier comme marraine. Le texte que nous lisons est un extrait de reconstitution : ses signatures y sont recopiées, non vues sur le registre. Aucun lien de parenté avec la famille Gibert n'est dit. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0071.\n", "PN0072": "# Geneviève GODIER [?]\n\n*personne citée dans l'enquête*\n\n## En bref\n\nGeneviève Godier est la marraine de Geneviève Gibert, baptisée à Saint-Roch le 16 décembre 1744 ; le parrain est Pierre Neveux, marchand de vin. Son nom est lu « Godier » puis « Gaudier » sur le même extrait, ce qui laisse la lecture incertaine ; son prénom est celui de la baptisée, et aucun lien de parenté n'est dit. On ne sait rien d'autre d'elle.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0072.\n", "PN0073": "# Jean Baptiste GIBERT\n\n*fils de François GIBERT*\n\n## En bref\n\nJean Baptiste Gibert est, en 1787, « caissier des remises et envois d'argent pour la province » à Paris, et demeure à l'hôtel des Postes, rue Plâtrière, paroisse Saint-Eustache. Le 12 octobre, il comparaît à l'avis de parents des deux enfants mineurs de Paul César Gibert comme leur « oncle paternel », et il signe. En 1790, il comparaît de nouveau, dit « caissier des postes », « oncle paternel » des mêmes mineurs, devant le lieutenant civil du Châtelet.\n\n## Faits clés\n\n- **Naissance** : 1714/1773, Paris — *recherche infructueuse* [A0620]\n- **Parents** : François GIBERT (PR0036) et Marie DOLHAIN (PR0037) — *partiellement vérifié, déduit* [A0616]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0073.\n", "PN0074": "# Paul César GIBERT\n\n*fils de François GIBERT*\n\n## En bref\n\nPaul César Gibert est professeur de musique, officier de la chambre de Madame, sœur du Roi, et inspecteur de la manufacture royale de la Savonnerie, à Chaillot, « en survivance du sieur son père », selon l'avis de parents du 12 octobre 1787, qui le dit « défunt ». L'avis de 1790 reprend les mêmes qualités. Son père est François Gibert, valet de chambre du Roi et inspecteur de la Savonnerie, vivant en 1787 : « ayeul paternel » de ses enfants. Il est donc son fils ; la mère reste à établir (Marie Jeanne Dolhain par inférence).\n\n## Faits clés\n\n- **Naissance** : 1714/1773, Paris — *recherche infructueuse* [A0620]\n- **Parents** : François GIBERT (PR0036) et Marie DOLHAIN (PR0037) — *partiellement vérifié, déduit* [A0614]\n- **Mariage** : avec Marie Marguerite DUBOIS (PN0076) — 1752/1795, Paris — *recherche infructueuse* [A0624]\n- **Décès** : date inconnue ; lieu : Paris — *recherche infructueuse* [A0622]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0074.\n", "PN0075": "# Charles César GIBERT\n\n*fils de François GIBERT*\n\n## En bref\n\nCharles César Gibert est, en 1787, « visiteur général des Postes et relais de France », demeurant à Paris rue Neuve-des-Petits-Champs, paroisse Saint-Roch. Le 12 octobre, il comparaît comme « oncle paternel » à l'avis de parents des deux enfants mineurs de son frère Paul César, qui vient de mourir, et se rapporte à justice : l'avis le propose subrogé tuteur de ses neveux et curateur au ventre de sa belle-sœur, enceinte d'un enfant posthume, Marie Marguerite Dubois. En 1790, il comparaît de nouveau comme oncle des mêmes mineurs, qualifié aussi de valet de chambre du Roi.\n\n## Faits clés\n\n- **Naissance** : 1714/1773, Paris — *recherche infructueuse* [A0620]\n- **Parents** : François GIBERT (PR0036) et Marie DOLHAIN (PR0037) — *partiellement vérifié, déduit* [A0615]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0075.\n", "PN0076": "# Marie Marguerite DUBOIS\n\n*personne citée dans l'enquête*\n\n## En bref\n\nMarie Marguerite Dubois est, le 12 octobre 1787, la veuve de Paul César Gibert, professeur de musique, enceinte d'un enfant posthume. Elle demeure à Monceaux près Paris, paroisse de Clichy, signe « M. M. Dubois » l'avis de parents réuni devant notaires, et y est désignée tutrice de leurs deux enfants mineurs, Christine Geneviève (dix ans) et Benoît Charles César (huit ans), puis de l'enfant à naître. Parmi les parents qui la soutiennent se trouvent le père de son mari, François Gibert, et deux de ses beaux-frères, Charles César et Jean Baptiste.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Paul César GIBERT (PN0074) — 1752/1795, Paris — *recherche infructueuse* [A0624]\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0076.\n", "PN0077": "# Benoît Charles César GIBERT\n\n*aïeul paternel (grand-père paternel) de François GIBERT*\n\n## En bref\n\nBenoît Charles César Gibert a huit ans le 12 octobre 1787 (il est donc né vers 1779) : il est l'un des deux enfants mineurs de feu Paul César Gibert, professeur de musique, et de Marie Marguerite Dubois, sa mère, veuve, tutrice, qui demeure à Monceaux près Paris et est alors enceinte d'un troisième enfant. Sa sœur est Christine Geneviève.\n\n## Faits clés\n\n- **Naissance** : vers 1779 — *partiellement vérifié, déduit* [A0663] ; lieu inconnu\n- **Parents** : Paul César GIBERT (PN0074) et Marie Marguerite DUBOIS (PN0076) — *vérifié* [A0601]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0077.\n", "PN0078": "# Christine Geneviève GIBERT\n\n*aïeul paternel (grand-père paternel) de François GIBERT*\n\n## En bref\n\nChristine Geneviève Gibert a dix ans le 12 octobre 1787 (elle est donc née vers 1777) : elle est l'aînée des deux enfants mineurs de feu Paul César Gibert, professeur de musique, et de Marie Marguerite Dubois, sa mère, veuve et tutrice, enceinte alors d'un troisième enfant. Son frère est Benoît Charles César.\n\n## Faits clés\n\n- **Naissance** : vers 1777 — *partiellement vérifié, déduit* [A0662] ; lieu inconnu\n- **Parents** : Paul César GIBERT (PN0074) et Marie Marguerite DUBOIS (PN0076) — *vérifié* [A0601]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0078.\n", "PN0079": "# Louis Armand GIBERT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nLouis Armand Gibert est marchand orfèvre à Paris, quai des Orfèvres, paroisse Saint-Barthélemy. Le 12 octobre 1787, il assiste à l'avis de parents des enfants de Paul César Gibert comme leur « oncle à la mode de Bretagne », c'est-à-dire un parent éloigné ; le degré exact et son lien avec François Gibert ne sont pas dits. Les orfèvres forment le dernier des Six Corps de marchands de Paris.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0079.\n", "PN0080": "# Benoît BRON\n\n*personne citée dans l'enquête*\n\n## En bref\n\nBenoît Bron est, en 1787, « directeur général du Département des Postes » selon notre lecture, et demeure à l'hôtel des Postes, rue Plâtrière, paroisse Saint-Eustache. Le 12 octobre 1787, il signe comme « ami » l'avis de parents des enfants de Paul César Gibert ; deux des Gibert de l'assemblée, Charles César et Jean Baptiste, travaillent aussi aux Postes. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0080.\n", "PN0081": "# Charles MITOIRE\n\n*personne citée dans l'enquête*\n\n## En bref\n\nCharles Mitoire est « visiteur des Postes » et demeure rue Plâtrière, paroisse Saint-Eustache. Le 12 octobre 1787, il signe comme « ami » l'avis de parents des enfants de Paul César Gibert ; Charles César Gibert, oncle des mineurs, est, lui, visiteur général des postes. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0081.\n", "PN0082": "# Estienne FÉGUIN\n\n*personne citée dans l'enquête*\n\n## En bref\n\nEstienne Féguin est maître apothicaire à Paris, rue Saint-Honoré, paroisse Saint-Roch, la paroisse de Charles César Gibert. Le 12 octobre 1787, il signe comme « ami » l'avis de parents des enfants de Paul César Gibert. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0082.\n", "PN0083": "# Jean Baptiste Louis DANINI\n\n*personne citée dans l'enquête*\n\n## En bref\n\nJean Baptiste Louis Danini n'est connu que par une entrée du répertoire du notaire Billard : un mariage avec Genevieve Christine Gibert, cité le 5 septembre 1793 ; ni contrat ni acte n'ont été lus.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Genevieve Christine GIBERT (PN0084) — 05/09/1793, Paris — *partiellement vérifié* [A0676]\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0083.\n", "PN0084": "# Genevieve Christine GIBERT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nGenevieve Christine Gibert n'est connue que par une entrée du répertoire du notaire Billard, qui cite, le 5 septembre 1793, son mariage avec Jean Baptiste Louis Danini ; ni contrat ni acte n'ont été lus. On se demande si elle est Christine Geneviève, fille de Paul César Gibert, née vers 1777 (mêmes prénoms inversés, âge compatible) : aucun document ne les relie.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Jean Baptiste Louis DANINI (PN0083) — 05/09/1793, Paris — *partiellement vérifié* [A0676]\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0084.\n", "PN0085": "# Georges DUBARD\n\n*personne citée dans l'enquête*\n\n## En bref\n\nGeorges Dubard naît à Paris, dans le 8e arrondissement, le 1er mars 1873 à 5 h du matin, 28 rue Jean-Goujon, au domicile de sa mère, Constance Dubard, couturière de vingt-huit ans ; son père n'est pas nommé. Ce n'est pas elle qui déclare la naissance, mais une sage-femme de vingt-quatre ans, Julia Pauline Viard, devant deux commissionnaires, Jacques Durand et Jean Burnier, témoins ; l'acte est dressé le 3 mars. Rien n'établit de lien entre lui et les Dubart de cette enquête, dont le nom s'écrit ici avec un d final. On ne sait rien de sa vie après sa naissance.\n\n## Faits clés\n\n- **Naissance** : 01/03/1873, Paris 8e — *vérifié* [A0735]\n- **Parents** : Constance DUBARD (PN0086) — *vérifié* [A0735] ; l'autre parent est inconnu\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0085.\n", "PN0086": "# Constance DUBARD\n\n*personne citée dans l'enquête*\n\n## En bref\n\nConstance Dubard n'apparaît que dans l'acte de naissance de son fils Georges Dubard, le 1er mars 1873 : elle est alors couturière, âgée de vingt-huit ans, et demeure 28 rue Jean-Goujon, dans le 8e arrondissement de Paris, où l'enfant naît à 5 h du matin ; le père n'est pas nommé. C'est une sage-femme, Julia Pauline Viard, qui déclare la naissance. Rien n'établit de lien de parenté entre Constance et les Dubart de cette enquête ; on ne connaît d'elle ni les origines, ni la suite de sa vie.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0086.\n", "PN0087": "# Cécile Alexandrine RIGNAULT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nUne fiche de l'état civil reconstitué porte la naissance d'une Cécile Alexandrine Rignault, le 22 avril 1849 à Paris, dans un arrondissement ancien que la fiche ne permet pas de lire avec certitude. Elle ne donne pas les parents ; selon l'arbre familial, non vérifié, Cécile Alexandrine serait la fille de Jean Louis Alexandre Rignault et d'Adèle Félicie Bosse, donc la sœur de Marie Félicie, et elle serait morte à trois ans, le 26 juillet 1852. Aucun acte de décès n'a été lu.\n\n## Faits clés\n\n- **Naissance** : 22/04/1849, Paris — *partiellement vérifié* [A0774]\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0087.\n", "PN0088": "# Hippolyte Félix BOSSÉ\n\n*mentionné dans un acte de Felix BOSSE*\n\n## En bref\n\nHippolyte Félix Bossé n'est connu que par une fiche de l'état civil reconstitué : il serait mort le 9 juin 1849 dans le 6e arrondissement de Paris (celui d'avant 1860), sans âge, parents ni profession. Ses prénoms sont ceux de Félix Hippolyte Bosse, le père d'Adèle Félicie, dans l'ordre inverse, et un document de famille porte la même année 1849 : il pourrait donc s'agir de lui, d'un parent homonyme ou de quelqu'un sans lien, et rien ne le tranche. L'acte de décès rétabli, cherché parmi ceux du 9 juin 1849, n'a pas été retrouvé.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : 09/06/1849, Paris 6e (ancien) — *partiellement vérifié* [A0767]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0088.\n", "PN0089": "# Jean Édouard Amélie LEPINOY\n\n*fils de Marie LEPINOIS OU LEPINOY*\n\n## En bref\n\nJean Édouard Amélie naît à Paris le 16 juillet 1804 (27 messidor an XII), à deux heures de l'après-midi, rue Saint-Benoît, dans l'ancien 10e arrondissement. Sa mère, Marie Anne Rosalie Lepinois, est couturière, née à Noyon ; c'est une sage-femme qui déclare la naissance. L'acte ne nomme pas de père, ce qui ne prouve ni une naissance hors mariage ni l'absence de père : on ne sait rien de la situation de la mère à cette date. Sur les fiches, le nom de l'enfant s'écrit Lepinoy.\n\n## Faits clés\n\n- **Naissance** : 16/07/1804, Paris 10e — *vérifié* [A0785]\n- **Parents** : Marie Anne Rosalie LEPINOIS OU LEPINOY (P7060) — *partiellement vérifié* [A0787] ; l'autre parent est inconnu\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : date inconnue ; lieu : Paris 6e — *partiellement vérifié* [A0790]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0089.\n", "PN0090": "# Jean Baptiste Théodore DEVILLERS\n\n*déclarant dans un acte de Marie LEPINOIS OU LEPINOY*\n\n## En bref\n\nJean Baptiste Théodore Devillers est tailleur, dit âgé de 66 ans, et demeure au 3 rue des Petites-Écuries, dans la maison où meurt, le 1er février 1862, Marie Anne Rosalie Lépinois, veuve Rignault. Il déclare ce décès avec Jean Louis Alexandre Rignault, fils de la défunte. Aucun lien avec la famille n'est établi, et l'on ne sait rien de plus de lui. Le métier de tailleur d'habits fut longtemps celui d'une corporation, aux statuts de 1660, supprimée en 1791.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0090.\n"};
const LIB = {"verifie": "vérifié", "partiellement_verifie": "partiellement vérifié", "non_verifie": "non vérifié", "contredit": "contredit", "refute": "réfuté", "non_resolu": "non résolu", "non_recherche": "non recherché", "recherche_infructueuse": "recherche infructueuse"};
const parSosa = {};
Object.values(G).forEach(p => { if (p.sosa) parSosa[p.sosa] = p; });
const COUL = s => s === "verifie" ? "var(--ok)" : s === "partiellement_verifie" ? "var(--part)"
  : s === "non_verifie" ? "var(--nv)" : "var(--bad)";
const TIRET = s => s === "verifie" || s === "partiellement_verifie" ? "" : s === "non_verifie" ? "5 4" : "1 4";
const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

// --- Géométrie : colonne 0 = descendants de René, colonne 1 = René (Sosa 1), puis une colonne par génération.
const maxSosa = Math.max(...Object.keys(parSosa).map(Number));
const NG = Math.floor(Math.log2(maxSosa)) + 1;          // générations d'ascendance
const LARG = 210, ECART = 46, PAS = 52, X0 = 16, Y0 = 34;
const HAUT_TOTAL = PAS * 2 ** (NG - 1);
const hauteurCase = g => Math.min(78, PAS * 2 ** (NG - 1 - g) - 10);
const xCol = c => X0 + c * (LARG + ECART);
const plan = document.getElementById("plan");
const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
plan.appendChild(svg);
const cases = {};

function dates(p) {
  const f = (e, sig) => e ? `<span class="${e.statut === "non_verifie" ? "nv" : ""}">${sig} ${e.an}</span>` : "";
  const n = f(p.n, "°"), d = f(p.d, "†");
  return n || d ? [n, d].filter(Boolean).join(" ") : "dates inconnues";
}
function autresEnfants(p, enfantLigne) {
  return Object.keys(p.enfants).filter(e => e !== enfantLigne).length;
}
function poserCase(p, x, y, h, col, enfantLigne) {
  const el = document.createElement("div");
  el.className = "case" + (h < 50 ? " petite" : "");
  Object.assign(el.style, { left: x + "px", top: y + "px", width: LARG + "px", height: h + "px" });
  if (!p) { el.classList.add("vide"); el.textContent = "inconnu — non établi"; plan.appendChild(el); return el; }
  const k = enfantLigne !== undefined ? autresEnfants(p, enfantLigne) : 0;
  el.innerHTML = `<span class="sosa">${p.sosa ? "Sosa " + p.sosa : ""}</span>`
    + `<div class="nom">${esc(p.nom)}${p.arbre ? "" : '<span class="neuf" title="Absente de l\'arbre Heredis, ajoutée par l\'enquête">enq.</span>'}</div>`
    + `<div class="pre">${esc(p.prenoms)}</div><div class="dates">${dates(p)}</div>`
    + (k ? `<span class="coll" title="Autres enfants connus dans la base">+${k}</span>` : "");
  if (h < 50) el.querySelector(".nom").textContent = p.nom + " " + p.prenoms.split(/[ "]/)[0];
  el.title = `${p.prenoms} ${p.nom} (${p.id})`;
  el.onclick = () => ouvrir(p.id);
  plan.appendChild(el);
  cases[p.id] = el;
  return el;
}
function trait(x1, y1, x2, y2, statut) {
  const xm = (x1 + x2) / 2;
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", `M${x1},${y1} H${xm} V${y2} H${x2}`);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", statut ? COUL(statut) : "var(--line)");
  path.setAttribute("stroke-width", statut === "verifie" ? 2.5 : 2);
  if (!statut) path.setAttribute("stroke-dasharray", "2 4");
  else if (TIRET(statut)) path.setAttribute("stroke-dasharray", TIRET(statut));
  svg.appendChild(path);
}
function titre(col, texte) {
  const t = document.createElement("div");
  t.className = "titrecol"; t.style.left = xCol(col) + "px"; t.style.top = "8px"; t.textContent = texte;
  plan.appendChild(t);
}

const centre = {};
for (let g = 0; g < NG; g++) {
  const h = hauteurCase(g), tranche = HAUT_TOTAL / 2 ** g;
  titre(g + 1, g === 0 ? "René" : g === 1 ? "Parents" : g === 2 ? "Grands-parents" : `Génération ${g + 1}`);
  for (let i = 0; i < 2 ** g; i++) {
    const n = 2 ** g + i, p = parSosa[n];
    const enfant = n > 1 ? parSosa[Math.floor(n / 2)] : null;
    if (!p && (n === 1 || !enfant)) continue;          // place inconnue d'une personne inconnue : rien à montrer
    const yc = Y0 + (i + 0.5) * tranche;
    centre[n] = yc;
    poserCase(p, xCol(g + 1), yc - h / 2, h, g + 1, enfant ? enfant.id : undefined);
    if (n > 1) trait(xCol(g) + LARG, centre[Math.floor(n / 2)], xCol(g + 1), yc, p ? (enfant.parents[p.id] || "") : "");
  }
}
// Descendants de René (colonne 0), avec leur conjoint.
const rene = parSosa[1];
if (rene) {
  titre(0, "Descendants");
  const desc = Object.keys(rene.enfants);
  const h = 66;
  desc.forEach((id, j) => {
    const p = G[id], y = centre[1] - (desc.length * (h + 12)) / 2 + j * (h + 12);
    poserCase(p, xCol(0), y, h, 0);
    trait(xCol(0) + LARG, y + h / 2, xCol(1), centre[1], rene.enfants[id]);
    Object.keys(p.conjoints).forEach((c, k) => {
      const yc = y + h + 18 + k * (h + 10);
      poserCase(G[c], xCol(0), yc, h, 0);
    });
  });
}
const LARG_PLAN = xCol(NG + 1), HAUT_PLAN = Y0 + HAUT_TOTAL + 20;
plan.style.width = LARG_PLAN + "px"; plan.style.height = HAUT_PLAN + "px";
svg.setAttribute("width", LARG_PLAN); svg.setAttribute("height", HAUT_PLAN);

// --- Zoom
let zoom = 1;
const vue = document.getElementById("vue");
function appliquer() { plan.style.transform = `scale(${zoom})`; plan.style.width = LARG_PLAN + "px"; plan.style.marginBottom = (HAUT_PLAN * (zoom - 1)) + "px"; plan.style.marginRight = (LARG_PLAN * (zoom - 1)) + "px"; }
function ajuster() { zoom = Math.max(0.45, Math.min(1, (vue.clientWidth - 10) / LARG_PLAN)); appliquer(); }
document.getElementById("plus").onclick = () => { zoom = Math.min(1.6, zoom * 1.2); appliquer(); };
document.getElementById("moins").onclick = () => { zoom = Math.max(0.3, zoom / 1.2); appliquer(); };
document.getElementById("ajuster").onclick = ajuster;

// --- Rendu des fiches (Markdown simple produit par outils/fiche.py)
const RE_ID = /\b(P(?:N|R)?\d{3,5})\b/g;
function inline(t) {
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+?)\*/g, "$1<em>$2</em>")
    .replace(RE_ID, (m, id) => G[id] ? `<a class="pid" data-id="${id}">${id}</a>` : m);
}
function markdown(md) {
  const out = []; let niveau = -1;
  const fermer = jusqua => { while (niveau > jusqua) { out.push("</li></ul>"); niveau--; } };
  for (const ligne of md.split("\n")) {
    const li = ligne.match(/^( *)- (.*)$/);
    if (li) {
      const n = Math.floor(li[1].length / 2);
      if (n > niveau) { while (niveau < n) { out.push("<ul><li>"); niveau++; } }
      else { fermer(n); out.push("</li><li>"); }
      out.push(inline(li[2])); continue;
    }
    fermer(-1);
    if (!ligne.trim()) continue;
    const h = ligne.match(/^(#{1,3}) (.*)$/);
    if (h) out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`);
    else out.push(`<p>${inline(ligne)}</p>`);
  }
  fermer(-1);
  return out.join("");
}
const contenu = document.getElementById("contenu");
const ONGLETS = { "Toutes les informations": "Toutes les informations",
  "Recherches menées": "Recherches", "Sources citées": "Sources" };
let ongletActif = "Biographie";
contenu.addEventListener("click", e => {
  const a = e.target.closest("a.pid"); if (a) { ouvrir(a.dataset.id); return; }
  const o = e.target.closest(".onglets button"); if (o) { montrer(o.dataset.t); return; }
  const r = e.target.closest("a.aid");            // [A0123] : ouvre l'assertion dans « Toutes les informations »
  if (r) {
    montrer("Toutes les informations");
    const li = [...contenu.querySelectorAll('.panneau[data-t="Toutes les informations"] li')].find(l => l.textContent.startsWith("[" + r.dataset.a + "]"));
    if (li) { li.scrollIntoView({ block: "center" }); li.style.background = "var(--hl)"; setTimeout(() => li.style.background = "", 1600); }
  }
});
function montrer(t) {
  if (!contenu.querySelector(`.panneau[data-t="${t}"]`)) t = contenu.querySelector(".panneau")?.dataset.t;
  if (!t) return;
  ongletActif = t;
  contenu.querySelectorAll(".panneau").forEach(p => p.hidden = p.dataset.t !== t);
  contenu.querySelectorAll(".onglets button").forEach(b => b.classList.toggle("actif", b.dataset.t === t));
}
function ouvrir(id) {
  document.querySelectorAll(".case.sel").forEach(c => c.classList.remove("sel"));
  if (cases[id]) { cases[id].classList.add("sel"); cases[id].scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" }); }
  const p = G[id];
  // Une section « ## » de la fiche = un onglet ; ce qui précède (nom, Sosa, note) reste en tête.
  const parts = (FICHES[id] || "").split(/^## /m);
  const tete = parts.shift();
  const sections = parts.map(s => { const i = s.indexOf("\n"); return [s.slice(0, i).trim(), s.slice(i + 1)]; });
  contenu.innerHTML = `<div class="entete"><button class="btn" id="retour">← Index</button>`
    + `<a href="personnes/${id}.html"><b>Ouvrir la page complète →</b></a>${p.sosa ? " · Sosa " + p.sosa : " · hors ascendance directe"}</div>`
    + (markdown(tete) || "<p class='aide'>Pas de fiche générée.</p>")
    + `<div class="onglets">${sections.map(([t]) => `<button data-t="${esc(t)}">${esc(ONGLETS[t] || t)}</button>`).join("")}</div>`
    + sections.map(([t, md]) => `<div class="panneau" data-t="${esc(t)}">${markdown(md)
        .replace(/\b(AR?\d{4})\b(?![^<]*<\/a>)/g, '<a class="aid" data-a="$1">$1</a>')}</div>`).join("");
  document.getElementById("retour").onclick = index;
  montrer(ongletActif);
  contenu.scrollTop = 0;
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
}
function index() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const toutes = Object.values(G).filter(p => !q || `${p.prenoms} ${p.nom} ${p.id}`.toLowerCase().includes(q));
  const asc = toutes.filter(p => p.sosa).sort((a, b) => a.sosa - b.sosa);
  const autres = toutes.filter(p => !p.sosa).sort((a, b) => (a.nom + a.prenoms).localeCompare(b.nom + b.prenoms, "fr"));
  const ligne = p => `<li><span class="s">${p.sosa ? "Sosa " + p.sosa : p.id}</span><span><a class="pid" data-id="${p.id}">${esc(p.nom)} ${esc(p.prenoms)}</a> <span class="aide">${dates(p)}</span></span></li>`;
  contenu.innerHTML = `<p class="aide">${Object.keys(G).length} personnes dans la base. Cliquez une case de l'arbre ou un nom pour ouvrir sa fiche ; dans une fiche, chaque identifiant (P…) mène à la fiche de la personne citée.</p>`
    + `<h3>Ascendants directs (${asc.length})</h3><ul class="liste">${asc.map(ligne).join("")}</ul>`
    + `<h3>Autres personnes : collatéraux, alliés, témoins (${autres.length})</h3><ul class="liste">${autres.map(ligne).join("")}</ul>`;
}
document.getElementById("q").addEventListener("input", index);
document.getElementById("index").onclick = () => { document.getElementById("q").value = ""; index(); };
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (G[id]) ouvrir(id); });
const depart = location.hash.slice(1);
if (G[depart]) ouvrir(depart); else index();
ajuster();
</script>
</body>

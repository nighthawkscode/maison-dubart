const FICHES = {"P5184": "# Edouard Jean \"René\" DUBART\n\n*René Dubart (1900-1994), point de départ de l'arbre*\n\n## En bref\n\nÉdouard Jean René Dubart, dit René, naît le 19 janvier 1900 à 17 h 20, au domicile de ses parents, 139 rue d'Aboukir, à Paris (2e arrondissement). L'acte le dit fils de Léon Dubart, caissier, et de Jeanne Augustine Baron Marchal, couturière. Son grand-père Edmond Dubart, employé de banque, est l'un des témoins de la déclaration ; le lien de parenté n'est pas écrit dans l'acte, il est déduit. Sa grand-mère Marie Félicie Rignault le nomme « son petit-fils » dans son faire-part de décès, en 1918.\n\n## Faits clés\n\n- **Naissance** : 19/01/1900, Paris 2e — *vérifié* [A0400]\n- **Parents** : Léon DUBART (P5227) et Jeanne Augustine BARON MARCHAL (P5229) — *vérifié* [A0402]\n- **Mariage** : avec Luce \"Renée\" LEBLANC (P5187) — 24/10/1922, Vincennes — *vérifié* [A0408]\n- **Décès** : 05/12/1994, Fontainebleau — *vérifié* [A0409]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5184.\n", "P5187": "# Luce \"Renée\" LEBLANC\n\n*épouse de René DUBART ; épouse de René DUBART*\n\n## En bref\n\nLuce Renée Leblanc naît le 24 janvier 1901, à 10 h du matin, à Châlons-sur-Marne. L'acte la dit fille de Louis Auguste Leblanc, limonadier de 24 ans, et de Marguerite Elisabeth Marie Eléonore Belloy, 18 ans, mariés. Au dénombrement de 1901, elle figure à deux mois avec ses parents.\n\n## Faits clés\n\n- **Naissance** : 24/01/1901, Châlons-sur-Marne — *vérifié* [A0419]\n- **Parents** : Louis Auguste LEBLANC (PN0030) et Marguerite Elisabeth Marie Eléonore BELLOY (PN0031) — *vérifié* [A0420]\n- **Mariage** : avec Edouard Jean \"René\" DUBART (P5184) — 24/10/1922, Vincennes — *vérifié* [A0408]\n- **Décès** : 10/08/1995, Fontainebleau, Seine-et-Marne — *non vérifié (arbre familial)* [AR0012]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5187.\n", "P5227": "# Léon DUBART\n\n*père de René*\n\n## En bref\n\nLéon naît le 18 avril 1869 à Paris, dans le 17e arrondissement, au domicile de ses parents, Edmond Dubart et Marie Félicie Rignault ; l'acte, lu avec une probabilité moyenne, les place rue Beudant, dans les Batignolles, un quartier rattaché à Paris en 1860 et en grande partie bâti sous le Second Empire. Son oncle Charles Dubart, employé à Levallois-Perret, est témoin de la naissance (l'identification est déduite). L'acte de mariage de 1897 donne 1868 pour l'année de naissance, mais l'acte de naissance tranche pour 1869. …\n\n## Faits clés\n\n- **Naissance** : 18/04/1869, Paris 17e — *vérifié* [A0387]\n- **Baptême** : 27/05/1869, Paris — *non vérifié (arbre familial)* [AR0015]\n- **Parents** : Edmond DUBART (P5232) et Marie Félicie RIGNAULT (P5234) — *vérifié* [A0388]\n- **Mariage** : avec Jeanne Augustine BARON MARCHAL (P5229) — 26/04/1897, Tours — *vérifié* [A0010]\n- **Mariage** : avec Solange GASNIER (P5241) — 02/06/1923, Paris 12e — *vérifié* [A0457]\n- **Décès** : 11/05/1944, Paris 15e — *vérifié* [A0467]\n- **Inhumation** : 13/05/1944, Paris — *non vérifié (arbre familial)* [AR0024]\n\n*Versions divergentes (voir Toutes les informations) : décès A0458.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5227.\n", "P5229": "# Jeanne Augustine BARON MARCHAL\n\n*mère de René*\n\n## En bref\n\nJeanne Augustine naît le 13 septembre 1873 à 23 h à Clermont-Ferrand, au 5 rue Montlosier, domicile de l'accoucheuse Anne Fontbonne, veuve Chassaigne ; la naissance est déclarée le 16. L'acte donne pour mère « Anne Baron », célibataire de 25 ans, native de Lyon, et ne nomme aucun père. Il rapporte la déclaration de l'accoucheuse : il n'établit ni l'existence ni l'âge de cette Anne Baron. Qui est vraiment sa mère n'est pas établi : l'arbre familial, non vérifié, propose Augustine Marchal, mais d'autres pistes restent ouvertes, et le père est inconnu. …\n\n## Faits clés\n\n- **Naissance** : 13/09/1873, Clermont-Ferrand, 5 rue Montlosier — *vérifié* [A0001]\n- **Parents** : Anne BARON (PN0008) — *vérifié* [A0003] ; Augustine MARCHAL (P13354) — *non vérifié (arbre familial)* [AR0209] — les sources ne s'accordent pas, voir Famille\n- **Mariage** : avec Léon DUBART (P5227) — 26/04/1897, Tours — *vérifié* [A0010]\n- **Décès** : 04/05/1922, Paris 10e, 28 boulevard Bonne-Nouvelle — *vérifié* [A0348]\n- **Inhumation** : 06/05/1922, Paris — *non vérifié (arbre familial)* [AR0030]\n\n*Versions divergentes (voir Toutes les informations) : naissance AR0026 ; décès AR0029.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5229.\n", "P5232": "# Edmond DUBART\n\n*grand-père de René, côté paternel*\n\n## En bref\n\nEdmond Dubart naît à Paris, dans le 1er arrondissement, le 17 mai 1836 et est baptisé le 2 juin à Saint-Germain-l'Auxerrois. Ses parents, Louis Charles Ambroise Dubart et Marie Octavie Gibert, vivent rue de l'Échelle ; son parrain est son oncle maternel, Camille Melchior Gibert, et sa marraine sa tante Thaïs Dubart, épouse de ce dernier. Il grandit avec au moins un frère, Charles Alfred, de sept ans son aîné. C'est la Monarchie de Juillet, un régime où l'électorat est restreint par le cens  …\n\n## Faits clés\n\n- **Naissance** : 17/05/1836, Paris, paroisse Saint-Germain-l'Auxerrois — *vérifié* [A0257]\n- **Baptême** : 02/06/1836, Paris — *non vérifié (arbre familial)* [AR0033]\n- **Parents** : Louis Charles Ambroise DUBART (P5761) — *vérifié* [A0240] et Marie Octavie GIBERT (P7411) — *vérifié* [A0257]\n- **Mariage** : avec Marie Félicie RIGNAULT (P5234) — 09/07/1868, Paris 9e — *vérifié* [A0258]\n- **Décès** : 10/05/1903, Paris 14e — *vérifié* [A0381]\n- **Inhumation** : 13/05/1903, Paris, cimetière de Montmartre — *vérifié* [A0695]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5232.\n", "P5234": "# Marie Félicie RIGNAULT\n\n*grand-mère de René, côté paternel*\n\n## En bref\n\nMarie Félicie naît le 26 janvier 1847, à neuf heures du matin, dans le 3e arrondissement de Paris, au domicile de ses parents, faubourg Saint-Denis. Son père, Jean Louis Alexandre Rignault, 39 ans, artiste musicien, déclare la naissance ; sa mère est Adèle Félicie Bosse, qu'il a épousée en novembre 1844. Parmi les témoins, un Alexandre de 66 ans, artiste musicien lui aussi, rue des Petites-Écuries, semble se dire aïeul paternel de l'enfant : Alexandre Rignault et Marie Anne Rosalie Lepinois sont ses grands-parents paternels, Félix Hippolyte Bosse et Marie Joséphine Gindre ses grands-parents …\n\n## Faits clés\n\n- **Naissance** : 26/01/1847, Paris 3e — *vérifié* [A0360]\n- **Parents** : Jean Louis Alexandre RIGNAULT (P5764) et Adèle Félicie BOSSE (P5767) — *vérifié* [A0258]\n- **Mariage** : avec Edmond DUBART (P5232) — 09/07/1868, Paris 9e — *vérifié* [A0258]\n- **Décès** : 18/02/1918, Paris 10e — *vérifié* [A0365]\n- **Inhumation** : 21/02/1918, Paris, cimetière de Montmartre — *vérifié* [A0757]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5234.\n", "P5241": "# Solange GASNIER\n\n*épouse de Léon DUBART ; épouse de Léon DUBART*\n\n## En bref\n\nSolange Gasnier naît le 23 février 1879 à Bourges (Cher). L'acte de son mariage de 1923 la dit fille d'Alfred Gasnier et de Solange Minois, tous deux décédés cette année-là ; ces parents ne sont pas confirmés par un acte de naissance.\n\n## Faits clés\n\n- **Naissance** : 23/02/1879, Bourges — *vérifié* [A0460]\n- **Parents** : Alfred GASNIER (PN0046) et Solange MINOIS (PN0047) — *vérifié* [A0461]\n- **Mariage** : avec Léon DUBART (P5227) — 02/06/1923, Paris 12e — *vérifié* [A0457]\n- **Mariage** : avec Jean Baptiste LAFORGUE (PN0048) — date et lieu inconnus (aucun acte de mariage dans la base ; union attestée par [A0462])\n- **Décès** : 1970, Montgeron, Essonne — *non vérifié (arbre familial)* [AR0050]\n- **Inhumation** : 02/09/1970, Paris — *non vérifié (arbre familial)* [AR0051]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5241.\n", "P5761": "# Louis Charles Ambroise DUBART\n\n*arrière-grand-père de René, côté paternel*\n\n## En bref\n\nLouis Charles Ambroise Dubart naît au Quesnel (Somme) le 25 brumaire an XIII, soit le 16 novembre 1804, à huit heures du soir. Son père, Jean Alexandre, alors cuisinier, le déclare le lendemain ; sa mère, Marie Josephine Sallart, est couturière. L'acte est signé « Le Fort, maire » et deux Le Fort sont témoins ; l'acte ne dit pas quels liens ils ont entre eux. Il est le dernier de cinq enfants connus : avant lui naissent au Quesnel trois sœurs, Charlotte Alexandrine, Colombe et Thaïs, et un frère, Charles Alexandre Éloi, en 1799 ; de ce frère, on ne sait rien après sa naissance. …\n\n## Faits clés\n\n- **Naissance** : 16/11/1804, Le Quesnel, Somme — *vérifié* [A0160]\n- **Parents** : Jean \"Alexandre\" DUBART (P9223) et Marie Josephine SALLART (P9225) — *vérifié* [A0160]\n- **Mariage** : avec Marie Octavie GIBERT (P7411) — 1772 à 1841, Paris — *recherche infructueuse* [A0542]\n- **Décès** : 12/10/1871, Paris 9e, quartier Rochechouart — *vérifié* [A0240]\n- **Inhumation** : 15/10/1871, Paris, cimetière du Père-Lachaise — *vérifié* [A0253]\n\n*Versions divergentes (voir Toutes les informations) : naissance A0242 ; inhumation A0254.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5761.\n", "P5762": "# Charles Alfred DUBART\n\n*fils de Louis DUBART*\n\n## En bref\n\nCharles Dubart naît à Paris, dans l'ancien 5e arrondissement, le 24 juin 1829, fils de Louis Charles Ambroise Dubart et de Marie Octavie Gibert ; son frère Edmond naîtra en 1836. L'acte original a disparu : il a été rétabli en 1872 d'après son mariage et ne dit rien d'autre que la filiation. Le prénom « Alfred » que lui donne l'arbre familial ne figure dans aucun des actes lus ; son identification avec le défunt de 1890 repose sur l'âge, la filiation et l'arbre.\n\n## Faits clés\n\n- **Naissance** : 24/06/1829, Paris, ancien 5e — *partiellement vérifié* [A0256]\n- **Parents** : Louis Charles Ambroise DUBART (P5761) et Marie Octavie GIBERT (P7411) — *vérifié* [A0239]\n- **Mariage** : avec Mathilde Emilie CINOT [?] (PN0027) — date et lieu inconnus (aucun acte de mariage dans la base ; union attestée par [A0378])\n- **Décès** : 26/06/1890, Paris 17e — *vérifié* [A0375]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5762.\n", "P5764": "# Jean Louis Alexandre RIGNAULT\n\n*arrière-grand-père de René, côté paternel*\n\n## En bref\n\nJean Louis Alexandre Rignault naît à Paris en janvier 1808, fils d'Alexandre Rignault et de Marie Anne Lepinois, que l'acte de mariage de 1844 nomme tous deux. La date reste discordante : le 7 janvier pour la fiche d'index de l'état civil reconstitué (7e arrondissement ancien), le 9 pour l'acte de décès de 1885 et pour l'ouvrage de référence sur la Société des concerts ; le prénom de son père varie lui aussi selon les actes, et la question n'est pas tranchée. …\n\n## Faits clés\n\n- **Naissance** : 07/01/1808, Paris, 7e arrondissement ancien — *partiellement vérifié* [A0293]\n- **Baptême** : 10/01/1808, Paris — *non vérifié (arbre familial)* [AR0067]\n- **Parents** : Alexandre RIGNAULT (P7058) et Marie Anne Rosalie LEPINOIS OU LEPINOY (P7060) — *vérifié* [A0297]\n- **Mariage** : avec Adèle Félicie BOSSE (P5767) — 10/11/1844, Paris, 6e arrondissement ancien — *partiellement vérifié* [A0295]\n- **Décès** : 29/08/1885, Gisors, 5 rue des Fontaines — *vérifié* [A0030]\n- **Inhumation** : 01/09/1885, Paris — *non vérifié (arbre familial)* [AR0075]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5764.\n", "P5767": "# Adèle Félicie BOSSE\n\n*arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nAdèle Félicie Bosse est la fille de Félix Hippolyte Bosse et de Marie Joséphine Gindre, son épouse, comme le dit l'acte de son mariage. Selon l'arbre familial, non vérifié, ses grands-parents paternels seraient Barthélémy Hippolyte Bosse et Adélaïde Louise Mahieu (ou Massieu, ou Malrieu), et ses grands-parents maternels Alexis Gindre et Marie Marcelle Dieu. Elle naît à Paris, peut-être le 19 janvier 1825 : une fiche de l'état civil reconstitué donne cette naissance pour une Adèle Félicie Bosse, sans nommer les parents  …\n\n## Faits clés\n\n- **Naissance** : 19/01/1825, Paris — *partiellement vérifié* [A0770]\n- **Parents** : Felix Hippolyte BOSSE (P7062) et Marie Josephine GINDRE (P7065) — *vérifié* [A0299]\n- **Mariage** : avec Jean Louis Alexandre RIGNAULT (P5764) — 10/11/1844, Paris, 6e arrondissement ancien — *partiellement vérifié* [A0295]\n- **Décès** : 11/02/1853, Paris 6e (ancien), 17 rue de Ménilmontant — *vérifié* [A0764]\n- **Inhumation** : 12/02/1853, Paris — *non vérifié (arbre familial)* [AR0079]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P5767.\n", "P7058": "# Alexandre RIGNAULT\n\n*arrière-arrière-grand-père de René, côté paternel*\n\n## En bref\n\nUn enfant prénommé Alexandre est baptisé le 5 novembre 1780 à Saulieu, en Côte-d'Or, bourg du Morvan sur la route de Paris à Lyon. L'acte le dit fils d'Alexandre Rignault, maître perruquier, semble-t-il, et de Jacquette Navarre ; son parrain est François, son frère mineur, sa marraine Anne, sa sœur mineure. Que ce nouveau-né soit l'Alexandre de Paris repose sur l'acte de décès de 1858, qui dit le défunt né à Saulieu, âgé de 77 ans et 2 mois, fils d'Alexandre Rignault et de Jaquette Navarre : le lien est partiellement vérifié. Le père, devenu limonadier, serait mort à Saulieu en juin 1816.\n\n## Faits clés\n\n- **Naissance** : 05/11/1780, Saulieu, Côte-d'Or — *non vérifié (arbre familial)* [AR0081]\n- **Baptême** : 05/11/1780, Saulieu — *vérifié* [A0128]\n- **Parents** : Alexandre RIGNAULT (PR0040) et Jacquette NAVARRE (PR0041) — *partiellement vérifié* [A0305]\n- **Mariage** : avec Marie Anne Rosalie LEPINOIS OU LEPINOY (P7060) — 21/08/1807, Paris — *partiellement vérifié* [A0292]\n- **Décès** : 24/01/1858, Paris, rue des Petites-Écuries 3 — *partiellement vérifié* [A0303]\n- **Inhumation** : 26/01/1858, Paris — *non vérifié (arbre familial)* [AR0084]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P7058.\n", "P7060": "# Marie Anne Rosalie LEPINOIS OU LEPINOY\n\n*arrière-arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nMarie Anne Rosalie Lepinois naît à Noyon, dans l'Oise, d'après l'acte de décès de 1862 qui la dit fille de Pierre Lépinois et de Marie Anne Rosalie Trousselle. La date du 4 novembre 1776 ne vient que d'un acte de 1804, où elle la donne de seconde main ; l'acte de décès lui prête quatre-vingt-six ans, soit un an de plus que ce calcul. On ne sait rien de son enfance, ni quand elle est arrivée à Paris.\n\n## Faits clés\n\n- **Naissance** : vers 1776, Noyon, Oise — *non vérifié (arbre familial)* [AR0086]\n- **Parents** : Pierre LEPINOIS (PR0042) et Marie Anne Rosalie TROUSSELLE (PR0043) — *vérifié* [A0782]\n- **Mariage** : avec Alexandre RIGNAULT (P7058) — 21/08/1807, Paris — *partiellement vérifié* [A0292]\n- **Décès** : 01/02/1862, Paris 10e — *vérifié* [A0780]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P7060.\n", "P7062": "# Felix Hippolyte BOSSE\n\n*arrière-arrière-grand-père de René, côté paternel*\n\n## En bref\n\nFélix Hippolyte Bosse est le père d'Adèle Félicie Bosse, qui épouse Jean Louis Alexandre Rignault en 1844 ; l'acte la dit fille de Félix Hippolyte Bosse et de Marie Joséphine Gindre, son épouse. Selon l'arbre familial, non vérifié, il serait né à Beauvais (Oise) le 15 février 1795, orphelin de père, fils de Barthélémy Hippolyte Bosse et d'Adélaïde Louise Mahieu (ou Massieu, ou Malrieu), et il aurait épousé Marie Joséphine Gindre à Paris, dans le 5e arrondissement d'alors, le 21 février 1824. Il n'a pas de frère ni de sœur connus. Son métier est inconnu.\n\n## Faits clés\n\n- **Naissance** : 15/02/1795, Beauvais, Oise — *non vérifié (arbre familial)* [AR0088]\n- **Parents** : Barthélémy Hippolyte BOSSE (PR0044) et Adelaïde Louise MAHIEU ou MASSIEU ou MALRIEU (PR0045) — *non vérifié (arbre familial)* [AR0215]\n- **Mariage** : avec Marie Josephine GINDRE (P7065) — 21/02/1824, Paris, 5ème — *non vérifié (arbre familial)* [AR0187]\n- **Décès** : avant le 09/10/1871, Paris — *partiellement vérifié, déduit* [A0315]\n\n*Versions divergentes (voir Toutes les informations) : décès AR0090, A0127.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P7062.\n", "P7065": "# Marie Josephine GINDRE\n\n*arrière-arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nMarie Joséphine Gindre naît à Paris vers 1798 : c'est l'âge, 73 ans, que lui donne l'acte de son décès, qui la dit née à Paris et rentière. Selon l'arbre familial, non vérifié, elle serait la fille d'Alexis Gindre et de Marie Marcelle Dieu, et elle aurait épousé Félix Hippolyte Bosse à Paris, dans le 5e arrondissement d'alors, le 21 février 1824. Une hypothèse relie à elle un Alexis Gindre mort à Paris en 1810 ; rien ne l'établit. De ces années, on ne sait rien d'autre.\n\n## Faits clés\n\n- **Naissance** : vers 1798, Paris — *non vérifié (arbre familial)* [AR0091]\n- **Parents** : Alexis GINDRE (PR0046) et Marie Marcelle DIEU (PR0047) — *non vérifié (arbre familial)* [AR0216]\n- **Mariage** : avec Felix Hippolyte BOSSE (P7062) — 21/02/1824, Paris, 5ème — *non vérifié (arbre familial)* [AR0187]\n- **Décès** : 09/10/1871, Paris 17e, rue Beudant 19 — *vérifié* [A0312]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P7065.\n", "P7411": "# Marie Octavie GIBERT\n\n*arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nMarie Octavie Gibert est baptisée à Paris, à Notre-Dame-de-Bonne-Nouvelle, le 4 février 1808 : la table des baptêmes de la paroisse inscrit ce jour-là une « Marie Octavie » Gibert. Elle ne nomme pas les parents ; le rapprochement avec la fille de Marin François Gibert et de Catherine Foucamprez repose sur le nom, le prénom composé et la paroisse du couple, et il est probable plutôt que prouvé. Si c'est bien elle, elle est née entre août 1807 et ce début de février 1808, ce qui s'accorde avec l'âge de 52 ans que ses fils déclarent à son décès  …\n\n## Faits clés\n\n- **Naissance** : 1807-08/1808-02, Paris — *partiellement vérifié, déduit* [A0691]\n- **Parents** : Marin François GIBERT (P8800) et Marie Catherine FOUCAMPREZ (P8802) — *vérifié* [A0237]\n- **Mariage** : avec Louis Charles Ambroise DUBART (P5761) — 1772 à 1841, Paris — *recherche infructueuse* [A0542]\n- **Décès** : 09/08/1860, Paris 9e, rue Bleue 35 — *vérifié* [A0236]\n- **Inhumation** : 06/12/1871, Paris, cimetière de Montmartre — *vérifié* [A0254]\n\n*Versions divergentes (voir Toutes les informations) : naissance AR0095, A0499, A0688, A0692 ; inhumation AR0097, A0255.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P7411.\n", "P8800": "# Marin François GIBERT\n\n*arrière-arrière-grand-père de René, côté paternel*\n\n## En bref\n\nMarin François Gibert (son baptême et la table des décès de 1829 le nomment François Marin) naît à Paris le 23 août 1751 et est baptisé le lendemain à Saint-Roch, fils de François Gibert, maître mercier et officier de Madame la Dauphine, et de Marie Jeanne Dolhain, de la rue Saint-Honoré. Son parrain est Marin de La Motte, bourgeois de Paris, rue des Deux-Écus, et sa marraine Marie Magdeleine Françoise Collot, fille, rue Neuve-de-Luxembourg ; aucun lien de parenté n'est dit. Sa sœur aînée vraisemblable, Geneviève, a été baptisée en 1744 de mêmes parents nommés.\n\n## Faits clés\n\n- **Naissance** : 23/08/1751, Paris, Saint Roch — *non vérifié (arbre familial)* [AR0099]\n- **Baptême** : 24/08/1751, Paris, paroisse Saint-Roch — *vérifié* [A0562]\n- **Parents** : François GIBERT (PR0036) et Marie DOLHAIN (PR0037) — *vérifié* [A0563]\n- **Mariage** : avec Marie Catherine FOUCAMPREZ (P8802) — 08/12/1793, Paris, ci-devant municipalité — *partiellement vérifié* [A0513]\n- **Décès** : 05/10/1829, Paris, Manufacture des tabacs — *vérifié* [A0246]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P8800.\n", "P8802": "# Marie Catherine FOUCAMPREZ\n\n*arrière-arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nMarie Catherine Foucamprez naît à Paris et est baptisée le même jour, le 3 mars 1771, à Saint-Sulpice : l'extrait la dit fille d'Adrien Foucamprez, présent, et de Catherine Colin, son épouse, qui demeurent rue du Sépulcre, l'actuelle rue du Dragon. Son parrain, François Étienne Alexis Foucamprez, porte le nom de son père (un frère ou un parent est probable, le lien n'est pas dit) ; sa marraine est Marie Madeleine Dettous. On ne connaît d'elle aucun frère ni sœur.\n\n## Faits clés\n\n- **Naissance** : 03/03/1771, Paris — *non vérifié (arbre familial)* [AR0102]\n- **Baptême** : 03/03/1771, Paris, paroisse Saint-Sulpice — *vérifié* [A0555]\n- **Parents** : Adrien FOUCAMPREZ (PN0065) et Catherine COLIN (PN0066) — *vérifié* [A0556]\n- **Mariage** : avec Marin François GIBERT (P8800) — 08/12/1793, Paris, ci-devant municipalité — *partiellement vérifié* [A0513]\n- **Décès** : 14/09/1827, Paris (ancien 5e), 31 boulevard Bonne-Nouvelle — *vérifié* [A0559]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P8802.\n", "P8808": "# Camille Melchior GIBERT\n\n*fils de Marin GIBERT*\n\n## En bref\n\nCamille Melchior Gibert naît à Paris le 1er fructidor an V, soit le 18 août 1797, à 5 h du matin, rue du Faubourg-Poissonnière n° 31 (3e arrondissement ancien, division Poissonnière). L'acte de naissance, lu dans un extrait de la seconde minute, le dit fils de François Marin Gibert, « employé à la Poste », et de Marie Catherine Foucamprez, son épouse, mariés le 18 frimaire an II (8 décembre 1793), d'après l'acte lui-même. Deux témoins : Jean Claude Paris, 62 ans, employé, rue des Vieux-Augustins, et Charlotte Aimée Lique, 33 ans, rentière, domiciliée dans la maison de l'accouchée  …\n\n## Faits clés\n\n- **Naissance** : 18/08/1797, Paris — *vérifié* [A0502]\n- **Baptême** : 19/08/1797 — *non vérifié (arbre familial)* [AR0106] ; lieu inconnu\n- **Parents** : Marin François GIBERT (P8800) et Marie Catherine FOUCAMPREZ (P8802) — *vérifié* [A0231]\n- **Mariage** : avec Marie Françoise Thais DUBART (P8810) — 04/10/1828, Paris, ancien 3e — *vérifié* [A0230]\n- **Décès** : 30/07/1866, Paris 10e, 104 rue du Faubourg-Poissonnière — *vérifié* [A0251]\n\n*Versions divergentes (voir Toutes les informations) : décès A0482, A0486.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P8808.\n", "P8810": "# Marie Françoise Thais DUBART\n\n*fille de Alexandre DUBART*\n\n## En bref\n\nMarie Françoise Thaïs Dubart naît au Quesnel, en Picardie, le 3 ventôse an VI, soit le 21 février 1798. Son acte de naissance n'a pas été lu ; c'est son acte de mariage qui la dit fille de Jean Alexandre Dubart, propriétaire, mort au Quesnel en 1821, et de Joséphine Salart, morte au même lieu en 1812, quand Thaïs avait quatorze ans. Les actes écrivent son nom de plusieurs façons : celui de 1866 la nomme Charlotte Françoise Thaïs. …\n\n## Faits clés\n\n- **Naissance** : 21/02/1798, Le Quesnel, Somme — *non vérifié (arbre familial)* [AR0113]\n- **Parents** : Jean \"Alexandre\" DUBART (P9223) et Marie Josephine SALLART (P9225) — *vérifié* [A0243]\n- **Mariage** : avec Camille Melchior GIBERT (P8808) — 04/10/1828, Paris, ancien 3e — *vérifié* [A0230]\n- **Décès** : après 1867 — *non vérifié (arbre familial)* [AR0116] ; lieu : Paris — *non résolu* [A0795]\n\n*Versions divergentes (voir Toutes les informations) : décès A0758, A0795.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P8810.\n", "P9223": "# Jean \"Alexandre\" DUBART\n\n*arrière-arrière-grand-père de René, côté paternel*\n\n## En bref\n\nJean Alexandre Dubart naît le 25 avril 1759 à Élincourt-Sainte-Marguerite, dans l'Oise, village du district de Noyon que l'extrait produit en 1794 appelle, comme le voulait la Révolution, « Elincourt la Montagne » ; il est baptisé le lendemain, et les pièces ne donnent pas toutes le même jour pour sa naissance. Il est le fils légitime de Jean Dubart, clerc séculier de la paroisse, qui signe, et de Magdeleine Lemaire. Son parrain est un garçon, Alexandre Loffart, que le curé dit « cousin germain maternel » et qui signe ; sa marraine, Geneviève Senechal, ne sait pas signer. …\n\n## Faits clés\n\n- **Naissance** : 25/04/1759, Elincourt-Sainte-Marguerite, Oise — *vérifié* [A0272]\n- **Baptême** : 26/04/1759, Elincourt-Sainte-Marguerite, Oise — *vérifié* [A0271]\n- **Parents** : Jean DUBART (PR0032) et Marie Magdeleine LEMAIRE (PR0033) — *vérifié* [A0200]\n- **Mariage** : avec Marie Josephine SALLART (P9225) — 02/10/1794, Amiens, Somme — *vérifié* [A0199]\n- **Décès** : 31/10/1821, Le Quesnel, Somme (château) — *vérifié* [A0157]\n\n*Versions divergentes (voir Toutes les informations) : naissance AR0118, A0201, A0276.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P9223.\n", "P9225": "# Marie Josephine SALLART\n\n*arrière-arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nMarie Josephine Sallart (les actes écrivent aussi Salart) naît le 22 septembre 1766 à Hédauville, un petit village de la Haute-Somme, elle est baptisée à la maison, en présence d'un chirurgien dont le nom est mal lu, « à cause du danger de mort » ; le lendemain, le curé d'Hédauville refait à l'église les cérémonies. À cette époque, selon un chiffre rapporté pour l'Europe, près d'un enfant sur quatre meurt avant un an. Elle est la fille de Jean Baptiste Firmin Sallart, mort avant 1794, et de Marie Dail  …\n\n## Faits clés\n\n- **Naissance** : 22/09/1766, Hédauville (registre de Senlis-le-Sec), Somme — *vérifié* [A0279]\n- **Parents** : Jean-Baptiste Firmin SALLART ou SALART (PR0034) et Marie Françoise DAILLE ou DAIL (PR0035) — *vérifié* [A0202]\n- **Mariage** : avec Jean \"Alexandre\" DUBART (P9223) — 02/10/1794, Amiens, Somme — *vérifié* [A0199]\n- **Décès** : 10/11/1812, Le Quesnel, Somme — *vérifié* [A0154]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P9225.\n", "P9232": "# Euchariste Eugène SALLE\n\n*personne citée dans l'enquête*\n\n## En bref\n\nEuchariste Eugène Sallé (les actes écrivent aussi Eugène Euchariste) est commis marchand de soieries. L'acte de mariage de 1827 le dit né le 1er mars 1800 à la Verrerie, dans l'Orne (nom de la commune à relire), fils de feu Julien Sallé, propriétaire, et de Jeanne Dupont ; il demeure rue de Richelieu, comme le témoin Jean-Baptiste Gay, marchand de soieries. Le 23 janvier 1827, à Paris (ancien 4e), il épouse Marie Charlotte Colombe Dubart. En octobre 1828, il est témoin au mariage de sa belle-sœur Thaïs, rue d'Angivilliers, n° 16.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Marie Charlotte Colombe DUBART (PN0010) — 23/01/1827, Paris, ancien 4e — *vérifié* [A0227]\n- **Décès** : 1843/1883 — *non vérifié (arbre familial)* [AR0124] ; lieu inconnu\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P9232.\n", "P10520": "# Florent Magloire DURSON\n\n*déclarant dans un acte de Alexandre DUBART*\n\n## En bref\n\nFlorent Magloire Durson est charpentier. Selon l'arbre familial, non vérifié, il naît vers 1791 au Plessier-Rozainvillers et devient charpentier et entrepreneur de construction. Le 28 novembre 1816, au Quesnel, il épouse Charlotte Alexandrine Dubart, couturière ; l'acte le dit charpentier, âgé de 25 ans, du Plessier-Rozainvillers, fils de Valentin Durson et de Marie Thérèse Haigny. La table décennale donne 1815 comme date de ce mariage, ce qui contredit le registre ; la contradiction n'est pas résolue.\n\n## Faits clés\n\n- **Naissance** : vers 1791, Le Plessier-Rozainvillers, Somme — *non vérifié (arbre familial)* [AR0126]\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Marie Josèphe Charlotte Alexandrine DUBART (PN0009) — 28/11/1816, Le Quesnel, Somme — *vérifié* [A0195]\n- **Décès** : après 1878 — *non vérifié (arbre familial)* [AR0127] ; lieu inconnu\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P10520.\n", "P10554": "# Jean Auguste BRUGNON\n\n*personne citée dans l'enquête*\n\n## En bref\n\nJean Auguste Brugnon n'apparaît dans la base que par l'arbre familial, qui le dit mort avant 1935 (non vérifié). On ne sait ni quand ni où il est né, ni qui étaient ses parents, ni s'il s'est marié. Aucun acte ne le concerne directement : son lien avec la famille Dubart reste à établir.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : avant 1935 — *non vérifié (arbre familial)* [AR0128] ; lieu inconnu\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P10554.\n", "P11866": "# Marie Barbe BAJOT\n\n*arrière-arrière-grand-mère de René, côté maternel*\n\n## En bref\n\nMarie Barbe Bajot est connue surtout par l'arbre familial, non vérifié : née à Lunéville (Meurthe-et-Moselle) le 2 août 1774, rentière, elle aurait épousé Jean Marchal le 27 février 1794 (9 ventôse an II), puis se serait remariée à Paris le 17 novembre 1825 avec Félix Fauquet, dont on ne sait rien d'autre ; ce second mariage n'est connu que par l'arbre, non vérifié. Seule trace en archives : l'acte de baptême de son fils Nicolas la nomme (lecture probable) épouse de Jean Marchal, 42 ans, et lui donne 35 ans, âge compatible avec une naissance en 1774. L'arbre la dit mère de Nicolas Marchal.\n\n## Faits clés\n\n- **Naissance** : 02/08/1774, Lunéville, Meurthe-et-Moselle — *non vérifié (arbre familial)* [AR0130]\n- **Parents** : François BAJOT (PR0058) et Marie CHARPENTIER (PR0059) — *non vérifié (arbre familial)* [AR0218]\n- **Mariage** : avec Jean MARCHAL (P11949) — 27/02/1794, Lunéville, Meurthe-et-Moselle — *non vérifié (arbre familial)* [AR0197]\n- **Mariage** : avec Félix FAUQUET (P25974) — 17/11/1825, Paris — *non vérifié (arbre familial)* [AR0199]\n- **Décès** : après 1836 — *non vérifié (arbre familial)* [AR0132] ; lieu inconnu\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P11866.\n", "P11879": "# Jean Pierre BARON\n\n*arrière-arrière-grand-père de René, côté maternel*\n\n## En bref\n\nJean Pierre Baron est boulanger, selon l'arbre familial, non vérifié. Il serait né à Guilliers (Morbihan) le 17 juillet 1781, se serait marié à Pontivy le 18 juillet 1813 avec Louise Guillemette Jaffredo et serait mort à Pontivy le 14 août 1835. Un acte de 1854 confirme qu'il est le père de Prudence Baron, et que ses parents, lui et Louise Jaffredo, sont tous deux décédés à Pontivy. Selon l'arbre, il serait fils de Joseph Joachim Baron et de Marie Guillotin.\n\n## Faits clés\n\n- **Naissance** : 17/07/1781, Guilliers, Morbihan — *non vérifié (arbre familial)* [AR0134]\n- **Parents** : Joseph Joachim BARON (PR0060) et Marie GUILLOTIN (PR0061) — *non vérifié (arbre familial)* [AR0219]\n- **Mariage** : avec Louise Guillemette JAFFREDO (P11884) — 18/07/1813, Pontivy, Morbihan — *non vérifié (arbre familial)* [AR0200]\n- **Décès** : 14/08/1835, Pontivy, Morbihan — *non vérifié (arbre familial)* [AR0135]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P11879.\n", "P11884": "# Louise Guillemette JAFFREDO\n\n*arrière-arrière-grand-mère de René, côté maternel*\n\n## En bref\n\nLouise Guillemette Jaffredo (l'acte de 1854 écrit seulement Louise) est la mère de Prudence Baron et l'épouse de Jean Pierre Baron ; tous deux sont dits décédés à Pontivy. Selon l'arbre familial, non vérifié, elle serait née à Pontivy le 4 octobre 1795 (12 vendémiaire an IV), mariée à Pontivy le 18 juillet 1813 et morte au même endroit le 28 avril 1821. Son mariage a probablement été enregistré à Napoléonville, ancien nom de Pontivy sous l'Empire. L'arbre la dit fille de Mathurin Jaffredo et de Marie Louise Sivien.\n\n## Faits clés\n\n- **Naissance** : 04/10/1795, Pontivy, Morbihan — *non vérifié (arbre familial)* [AR0136]\n- **Parents** : Mathurin JAFFREDO (PR0062) et Marie \"Louise\" SIVIEN (PR0063) — *non vérifié (arbre familial)* [AR0220]\n- **Mariage** : avec Jean Pierre BARON (P11879) — 18/07/1813, Pontivy, Morbihan — *non vérifié (arbre familial)* [AR0200]\n- **Décès** : 28/04/1821, Pontivy, Morbihan — *non vérifié (arbre familial)* [AR0137]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P11884.\n", "P11900": "# Prudence BARON\n\n*arrière-grand-mère de René, côté maternel*\n\n## En bref\n\nPrudence Baron naît à Pontivy (Morbihan) vers 1816-1817 : l'acte de décès la dit née à Pontivy et âgée de 68 ans, fille de Jean Pierre Baron et de Louise Jaffredo, tous deux décédés à Pontivy. Selon l'arbre familial, non vérifié, elle serait née le 27 août 1816 et se serait mariée à Pontivy le 6 janvier 1836 avec Nicolas Marchal. Un acte de 1854 dit que ses parents se sont mariés à Napoléonville, nom de Pontivy sous l'Empire, mais la date du mariage reste inconnue.\n\n## Faits clés\n\n- **Naissance** : 27/08/1816, Pontivy, Morbihan — *non vérifié (arbre familial)* [AR0138]\n- **Parents** : Jean Pierre BARON (P11879) et Louise Guillemette JAFFREDO (P11884) — *vérifié* [A0332]\n- **Mariage** : avec Nicolas MARCHAL (P11935) — 06/01/1836, Pontivy, Morbihan — *non vérifié (arbre familial)* [AR0202]\n- **Décès** : 04/04/1885, Saint-Didier-sur-Beaujeu, Rhône — *vérifié* [A0330]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P11900.\n", "P11935": "# Nicolas MARCHAL\n\n*arrière-grand-père de René, côté maternel*\n\n## En bref\n\nNicolas Marchal est gendarme, puis buraliste. Sa naissance est le point fragile. Un acte dit qu'un Nicolas Marchal naît le 12 janvier 1810 à Vannes-le-Châtel (Meurthe), de Jean Marchal et de Marie Bajot (lecture probable) ; l'arbre familial, non vérifié, en fait notre Nicolas. Mais l'acte ne prouve pas cette identité, qui reste une hypothèse. Les âges qu'il déclare au fil des actes donnent des naissances entre 1807 et 1813 et ne concordent exactement avec 1810 que deux fois ; le recensement de 1872 indique même un lieu de naissance en « Seine-et-Marne ».\n\n## Faits clés\n\n- **Naissance** : 12/01/1810, Vannes (Vannes-le-Châtel), Meurthe — *vérifié* [A0320]\n- **Parents** : Jean MARCHAL (P11949) et Marie Barbe BAJOT (P11866) — *partiellement vérifié* [A0321]\n- **Mariage** : avec Prudence BARON (P11900) — 06/01/1836, Pontivy, Morbihan — *non vérifié (arbre familial)* [AR0202]\n- **Décès** : entre 1885-04-04 et 1896-03-17 — *partiellement vérifié* [A0339] ; lieu : Monsols, Rhône — *non vérifié (arbre familial)* [AR0146]\n\n*Versions divergentes (voir Toutes les informations) : décès AR0146.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P11935.\n", "P11949": "# Jean MARCHAL\n\n*arrière-arrière-grand-père de René, côté maternel*\n\n## En bref\n\nJean Marchal est le père de Nicolas. Un acte de janvier 1810 le montre à Vannes (Vannes-le-Châtel, Meurthe), âgé de 42 ans, domestique chez un « Grisaux » (lecture incertaine) ; l'acte dit que sa femme, Marie Bajot (lecture probable), a 35 ans. Une hypothèse relie ce maître à Nicolas Griveau, propriétaire du château et de la verrerie du lieu ; elle repose sur un mot incertain.\n\n## Faits clés\n\n- **Naissance** : vers 1768 — *non vérifié (arbre familial)* [AR0148] ; lieu inconnu\n- **Parents** : Jacques MARCHAL (PR0056) et Rosalie MAGNIEN (PR0057) — *non vérifié (arbre familial)* [AR0217]\n- **Mariage** : avec Marie Barbe BAJOT (P11866) — 27/02/1794, Lunéville, Meurthe-et-Moselle — *non vérifié (arbre familial)* [AR0197]\n- **Décès** : 20/09/1822, Toul, Meurthe-et-Moselle — *non vérifié (arbre familial)* [AR0150]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P11949.\n", "P13354": "# Augustine MARCHAL\n\n*grand-mère de René, côté maternel*\n\n## En bref\n\nAugustine Marchal naît à Lorient, à la caserne de gendarmerie, le 9 février 1854 à 22 h. Elle est la fille de Nicolas Marchal, maréchal des logis de gendarmerie, 44 ans, et de Prudence Baron, 37 ans, sans profession. Sa sœur aînée est Anne Louise Angélique, dite Anaïs, qui épousera Louis Edouard Orsay.\n\n## Faits clés\n\n- **Naissance** : 09/02/1854, Lorient, caserne de gendarmerie — *vérifié* [A0326]\n- **Parents** : Nicolas MARCHAL (P11935) — *vérifié* [A0040] et Prudence BARON (P11900) — *vérifié* [A0327]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : 20/10/1909, Saint-Maurice, Val-de-Marne — *vérifié* [A0345]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir P13354.\n", "P20190": "# Léon DEMIL te et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PR0032.\n", "PR0033": "# Marie Magdeleine LEMAIRE\n\n*arrière-arrière-arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nMagdeleine Lemaire est la mère de Jean Alexandre Dubart. L'acte de baptême de celui-ci, à Elincourt-Sainte-Marguerite le 26 avril 1759, la dit épouse de Jean Dubart, clerc de la paroisse, et déclare l'enfant leur fils légitime. Le mariage d'Amiens de l'an III les nomme de la même façon, comme parents défunts.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Jean DUBART (PR0032) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PR0033.\n", "PR0034": "# Jean-Baptiste Firmin SALLART ou SALART\n\n*arrière-arrière-arrière-grand-père de René, côté paternel*\n\n## En bref\n\nJean-Baptiste Firmin Sallart (ou Salart) est le père de Marie Josephine Sallart. Elle naît à Hédauville le 22 septembre 1766 ; l'acte, enregistré dans le registre de Senlis-le-Sec, la dit fille légitime de « Jean Baptiste Firmin Sallart » (lecture probable) et de Marie Dail ; cet acte concorde avec l'extrait produit à son mariage d'Amiens. L'acte ne donne aucun métier pour le père.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Marie Françoise DAILLE ou DAIL (PR0035) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PR0034.\n", "PR0035": "# Marie Françoise DAILLE ou DAIL\n\n*arrière-arrière-arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nMarie Françoise Dail (ou Daille) est la mère de Marie Josephine Sallart, née à Hédauville le 22 septembre 1766. L'acte de baptême, enregistré dans le registre de Senlis-le-Sec, la nomme « Marie Dail », épouse de Jean Baptiste Firmin Sallart, et concorde avec l'extrait produit au mariage d'Amiens de l'an III. Le prénom Françoise ne vient que du rapport Heredis, qui donne les dates vers 1737 et après 1784, non vérifiées.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Jean-Baptiste Firmin SALLART ou SALART (PR0034) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PR0035.\n", "PR0036": "# François GIBERT\n\n*arrière-arrière-arrière-grand-père de René, côté paternel*\n\n## En bref\n\nFrançois Gibert est d'abord, à Paris, un père de famille de la rue Saint-Honoré. Le 16 décembre 1744, l'extrait de baptême de sa fille Geneviève, à Saint-Roch, le dit marchand mercier (« md mercier »), époux de Marie Jeanne Dolhain ; il est présent et signe. Le 24 août 1751, celui de son fils Marin François, à la même paroisse, le dit, selon notre lecture, maître mercier et officier de Madame la Dauphine. Le couple était marié avant décembre 1744 ; l'acte du mariage n'a pas été retrouvé. …\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Marie DOLHAIN (PR0037) — avant 12/1744, Paris — *recherche infructueuse* [A0570]\n- **Décès** : entre 1787-10-12 et 1790-06-22, Paris — *partiellement vérifié, déduit* [A0666]\n\n*Versions divergentes (voir Toutes les informations) : décès A0621.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PR0036.\n", "PR0037": "# Marie DOLHAIN\n\n*arrière-arrière-arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nMarie Jeanne Dolhain est connue d'abord comme mère. Le 16 décembre 1744, elle est nommée « Marie-Jeanne » dans l'extrait de baptême de sa fille Geneviève, à Saint-Roch, comme épouse de François Gibert, marchand mercier de la rue Saint-Honoré ; le 24 août 1751, elle l'est de nouveau pour son fils Marin François. Le rapport Heredis la nomme Marie Dolhain, sans date. Son mariage, avant décembre 1744, n'a pas été retrouvé. Cadre commun de l'époque, sans rien dire d'elle : l'épouse d'un marchand de la rue Saint-Honoré partageait souvent la boutique.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec François GIBERT (PR0036) — avant 12/1744, Paris — *recherche infructueuse* [A0570]\n- **Décès** : 1790-06-22/1796-11-24, Paris — *non vérifié, déduit* [A0658]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PR0037.\n", "PR0040": "# Alexandre RIGNAULT\n\n*arrière-arrière-arrière-grand-père de René, côté paternel*\n\n## En bref\n\nAlexandre Rignault, limonadier, né à Saulieu et âgé de 70 ans, est mort à Saulieu en juin 1816, époux de Marie Jaquette Navarre, que la fiche nomme Marie Jacquette (Jaquette) Navarre ; le couple n'est connu que par la filiation de leur fils, sans acte de mariage. Son âge donne une naissance vers 1746. Il est probablement le père d'Alexandre Rignault, mort à Paris en 1858, que l'acte dit fils de défunts Alexandre Rignault et Jaquette Navarre. Son métier de 1816 diffère de celui de « maître perruquier » donné au père dans le baptême de 1780 ; ce changement n'est pas expliqué. …\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Jacquette NAVARRE (PR0041) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PR0040.\n", "PR0041": "# Jacquette NAVARRE\n\n*arrière-arrière-arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nJacquette (ou Jaquette) Navarre est l'épouse d'Alexandre Rignault, limonadier de Saulieu, et la mère d'Alexandre Rignault, mort à Paris en 1858. Quand son mari meurt en juin 1816, un Philibert Navarre, limonadier de 64 ans, est présent comme beau-frère du défunt ; on ne sait pas s'il est son frère. On ne connaît ni sa naissance ni son décès.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Alexandre RIGNAULT (PR0040) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PR0041.\n", "PR0042": "# Pierre LEPINOIS\n\n*arrière-arrière-arrière-grand-père de René, côté paternel*\n\n## En bref\n\nPierre Lépinois n'est connu que par l'acte de décès de sa fille, en 1862, qui le dit père de Marie Anne Rosalie Lépinois, veuve d'Alexandre Rignault, et époux de Marie Anne Rosalie Trousselle ; le déclarant ne dit pas s'il était encore vivant. La fille est dite née à Noyon, dans l'Oise ; aucun acte de Noyon n'a été ouvert, et l'on ne sait ni sa date de naissance, ni son métier, ni où ni quand il est mort. Ses petits-enfants connus sont Jean Édouard Amélie, né en 1804 (la filiation avec sa fille reste partiellement vérifiée), et Jean Louis Alexandre Rignault, né en 1808.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Marie Anne Rosalie TROUSSELLE (PR0043) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PR0042.\n", "PR0043": "# Marie Anne Rosalie TROUSSELLE\n\n*arrière-arrière-arrière-grand-mère de René, côté paternel*\n\n## En bref\n\nMarie Anne Rosalie Trousselle n'est connue que par l'acte de décès de sa fille, en 1862, qui la dit mère de Marie Anne Rosalie Lépinois, veuve d'Alexandre Rignault, et épouse de Pierre Lépinois ; le déclarant ne dit pas si elle vivait encore. Aucun acte de mariage n'est connu et l'on ne sait ni où ni quand elle est née ou morte, ni si elle a connu ses petits-enfants, Jean Édouard Amélie (1804, filiation partiellement vérifiée) et Jean Louis Alexandre Rignault (1808).\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Pierre LEPINOIS (PR0042) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PR0043.\n", "PR0044": "# Barthélémy Hippolyte BOSSE\n\n*arrière-arrière-arrière-grand-père de René, côté paternel*\n\n## En bref\n\nBarthélémy Hippolyte Bosse n'est connu que par l'arbre familial, qui le donne, sans vérification, pour le père de Félix Hippolyte Bosse et l'époux d'Adélaïde Louise Mahieu (ou Massieu, ou Malrieu) ; on ne sait rien d'eux de plus, et aucun acte de mariage n'est connu. Le rapport de l'arbre lui prête les dates de 17 u (Rhône), où son père est receveur buraliste. Elle y est encore en 1876, sans enfant au foyer.\n\n## Faits clés\n\n- **Naissance** : 24/06/1844, Pontivy, Morbihan — *vérifié* [A0337]\n- **Parents** : Nicolas MARCHAL (P11935) — *vérifié* [A0040] et Prudence BARON (P11900) — *vérifié* [A0338]\n- **Mariage** : avec Louis Edouard ORSAY (PN0002) — 17/03/1896, Lyon 2e — *vérifié* [A0334]\n- **Décès** : inconnu (rien dans la base)\n\n*Versions divergentes (voir Toutes les informations) : naissance A0059.*\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0001.\n", "PN0002": "# Louis Edouard ORSAY\n\n*mentionné dans un acte de Jeanne BARON MARCHAL*\n\n## En bref\n\nLouis Edouard Orsay naît le 17 septembre 1841 à Paris, fils de Louis Edouard Orsay et d'Alexandrine Virginie Daunou, déjà décédés à son mariage ; la date vient de son acte de mariage, non de son acte de naissance. Il est chef de bureau au chemin de fer d'Orléans, domicilié à Juvisy, et veuf de Thérèse Florence Dury.\n\n## Faits clés\n\n- **Naissance** : 17/09/1841, Paris — *vérifié* [A0335]\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Anne Louise Angélique MARCHAL (PN0001) — 17/03/1896, Lyon 2e — *vérifié* [A0334]\n- **Décès** : 1903, Etréchy, Seine-et-Oise — *partiellement vérifié* [A0343]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0002.\n", "PN0003": "# Marcel Jean DUBART\n\n*fils de Edmond DUBART*\n\n## En bref\n\nMarcel Jean Dubart naît à Paris, dans le 16e arrondissement, celui de Passy, le 14 septembre 1876 ; la table des naissances du 16e le porte sous la graphie « Dubard », avec un jour lu 14 ou 17. Son acte de décès le dit fils d'Edmond Dubart et de Marie Félicie Rignault, déclaration faite par deux amis et non par ses parents ; l'acte de naissance lui-même n'a pas été lu, et l'on ne sait donc rien de l'adresse de ses parents en 1876. Il a un frère aîné, Léon, né en avril 1869, dont l'acte de décès le dit aussi le frère.\n\n## Faits clés\n\n- **Naissance** : 09/1876, Paris 16e (Passy) — *vérifié* [A0723]\n- **Parents** : Edmond DUBART (P5232) et Marie Félicie RIGNAULT (P5234) — *vérifié* [A0724]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : 15/08/1899, Tours, 12 rue Jules Moinaux — *vérifié* [A0020]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0003.\n", "PN0004": "# Anne FONTBONNE\n\n*déclarant dans un acte de Jeanne BARON MARCHAL*\n\n## En bref\n\nAnne Fontbonne naît à Clermont-Ferrand le 1er février 1831, fille d'André Fontbonne, tisserand, et de Gilberte Dumont (lecture incertaine). Le 18 octobre 1854, dans la même ville, elle épouse Annet-Auguste Chassaigne, conducteur de messageries.\n\n## Faits clés\n\n- **Naissance** : 01/02/1831, Clermont-Ferrand — *vérifié* [A0070]\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Annet-Auguste CHASSAIGNE (PN0005) — 18/10/1854, Clermont-Ferrand — *vérifié* [A0071]\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0004.\n", "PN0005": "# Annet-Auguste CHASSAIGNE\n\n*personne citée dans l'enquête*\n\n## En bref\n\nAnnet-Auguste Chassaigne naît à Charenton (Cher) le 31 mai 1819. Le 18 octobre 1854, à Clermont-Ferrand, il est conducteur de messageries et épouse Anne Fontbonne. Dans l'acte de naissance de Jeanne Augustine, en 1873, elle est dite « veuve Chassaigne » ; la date et le lieu de sa mort ne sont pas dans la base. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Anne FONTBONNE (PN0004) — 18/10/1854, Clermont-Ferrand — *vérifié* [A0071]\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0005.\n", "PN0006": "# François Emile RIGNAULT\n\n*fils de Alexandre RIGNAULT*\n\n## En bref\n\nFrançois Émile Rignault est le frère cadet de Jean Louis Alexandre ; l'acte de décès de leur père, en 1858, les dit tous deux ses fils. Leur mère est Marie Anne Lepinois d'après l'acte de 1844 de son frère, mais l'acte de décès de François Émile, en 1895, le dit fils de « Jean Baptiste Rignault » et d'« Augustine Lépinois » : ces prénoms diffèrent de ceux d'autres actes, et le doute n'est pas levé. Il serait né à Paris le 14 juin 1812 selon un ouvrage de référence sur la Société des concerts, source secondaire vue en extrait ; l'acte de décès lui donne 83 ans en 1895, soit un an de plus. …\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : Alexandre RIGNAULT (P7058) — *partiellement vérifié* [A0306] ; l'autre parent est inconnu\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : 15/03/1895, Paris 10e, 47 rue d'Hauteville — *vérifié* [A0744]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0006.\n", "PN0007": "# Louis Paulin PASSY\n\n*mentionné dans un acte de Jean RIGNAULT*\n\n## En bref\n\nLouis Paulin Passy, né le 4 décembre 1830, est député de l'Eure de 1871 à 1913 et conseiller municipal de Gisors ; ces données viennent d'une notice Wikipédia lue par résumé. Le 29 août 1885, il déclare le décès, à Gisors, de Jean Louis Alexandre Rignault, artiste musicien, veuf de Félicie Bosse, mort chez lui au 5 rue des Fontaines. Il se dit propriétaire, député et conseiller général de l'Eure, 54 ans, et ami du défunt. Le texte de la copie porte « Lassy » ; « Passy » est restitué d'après sa signature.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0007.\n", "PN0008": "# Anne BARON\n\n*mère de Jeanne BARON MARCHAL*\n\n## En bref\n\nAnne Baron n'est connue que par les actes de Jeanne Augustine. L'acte de naissance de 1873 la désigne comme mère : célibataire, 25 ans, native et résidente de Lyon. Il rapporte la déclaration de l'accoucheuse sans établir qu'elle existe. Au mariage de 1897, Jeanne Augustine est dite « fille naturelle non reconnue » d'Anne Baron et d'un père inconnu ; l'acte de décès de 1922 la dit « fille d'Anne Baron décédée ».\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0008.\n", "PN0009": "# Marie Josèphe Charlotte Alexandrine DUBART\n\n*fille de Alexandre DUBART*\n\n## En bref\n\nMarie Josèphe Charlotte Alexandrine Dubart, que l'on appelle Alexandrine, naît au Quesnel à l'été de l'an III (1795), le jour restant incertain, au domicile du citoyen Le Fort, où ses parents, Jean Alexandre Dubart et Josephine Sallart, sont alors installés. Son père la déclare, nommé « Jean Dubart » dans l'acte ; il y dit que sa femme et lui sont « tous deux domestiques » chez Le Fort, et deux témoins de leur entourage signent avec lui, un Jean Pierre Sallart, maçon semble-t-il, et Adélaïde Bigot, épouse de François Gouel. …\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : Jean \"Alexandre\" DUBART (P9223) et Marie Josephine SALLART (P9225) — *vérifié* [A0140]\n- **Mariage** : avec Florent Magloire DURSON (P10520) — 28/11/1816, Le Quesnel, Somme — *vérifié* [A0195]\n- **Décès** : 03/07/1859, Moreuil, Somme — *vérifié* [A0286]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0009.\n", "PN0010": "# Marie Charlotte Colombe DUBART\n\n*fille de Alexandre DUBART*\n\n## En bref\n\nMarie Charlotte Colombe Dubart naît au Quesnel le 30 thermidor an IV (17 août 1796), au domicile du citoyen Le Fort, où vivent ses parents, Jean Alexandre Dubart et Josephine Salart. Elle est la deuxième de cinq enfants : sa sœur aînée est Marie Josèphe Charlotte Alexandrine, ses cadets Marie Françoise Thaïs, Charles Alexandre Éloi et Louis Charles Ambroise, tous nommés comme enfants des mêmes parents dans leurs actes. Elle a seize ans quand sa mère meurt, vingt-cinq quand meurt son père.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : Jean \"Alexandre\" DUBART (P9223) et Marie Josephine SALLART (P9225) — *vérifié* [A0141]\n- **Mariage** : avec Euchariste Eugène SALLE (P9232) — 23/01/1827, Paris, ancien 4e — *vérifié* [A0227]\n- **Décès** : 20/05/1883, Paris, 82 rue Blanche — *vérifié* [A0244]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0010.\n", "PN0011": "# Charles Alexandre Eloi DUBART\n\n*fils de Alexandre DUBART*\n\n## En bref\n\nCharles Alexandre Éloi Dubart naît au Quesnel (Somme) le 28 frimaire an VIII, soit le 19 décembre 1799, au domicile du citoyen Le Fort, où ses parents, Jean Alexandre Dubart et Josephine Sallart, sont alors installés ; l'acte, dressé le lendemain, a été lu, mais la dernière lettre de son troisième prénom reste incertaine (Éloi ou Elui).\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : Jean \"Alexandre\" DUBART (P9223) et Marie Josephine SALLART (P9225) — *vérifié* [A0142]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0011.\n", "PN0012": "# Jean-Baptiste Barthélémy LE FORT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nJean-Baptiste Barthélemy Le Fort, écuyer, seigneur du Quesnel et de Saint-Mard, aurait fait bâtir en 1753 le château actuel du Quesnel et serait mort en 1767 ; ces dires viennent d'un ouvrage secondaire de 1923, sans notes, non vérifié. Une dame Marguerite-Léonore de Hée (?), dame du Hamel, est dite veuve d'un seigneur du Quesnel et de Saint-Mard Lefort dans des saisines de 1771 à 1774 ; le lien avec lui est partiellement vérifié.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Marguerite Léonore DE HÉE [?] (PN0018) — date et lieu inconnus (aucun acte de mariage dans la base ; union attestée par [A0174])\n- **Décès** : 1767, Le Quesnel — *non vérifié* [A0170]\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0012.\n", "PN0013": "# Marie Charlotte Ursule LE FORT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nMarie Charlotte Ursule Le Fort est dite par l'abbé Leroy (1923) fille unique de Léonor Augustin Le Fort, seigneur du Quesnel, née en 1782 ; ce récit est secondaire et non vérifié. Selon la même source, son père, sa mère et elle sont arrêtés en février 1794, puis libérés après des pétitions des habitants.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : Marie Jean-Baptiste Charles François Léonor Augustin LE FORT (PN0016) — *non vérifié* [A0185] ; l'autre parent est inconnu\n- **Mariage** : avec Louis-Alexandre BLIN DE BOURDON (PN0014) — 1806 — *non vérifié* [A0171] ; lieu inconnu\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0013.\n", "PN0014": "# Louis-Alexandre BLIN DE BOURDON\n\n*personne citée dans l'enquête*\n\n## En bref\n\nLouis-Alexandre Blin de Bourdon naît à Amiens en 1782 et meurt à Paris en 1849 d'après les sources secondaires. Il est maire de Bourdon, conseiller général, préfet provisoire de la Somme, maire d'Amiens (1816-1817), député de la Somme à plusieurs reprises, puis préfet de l'Oise (1823-1824) et du Pas-de-Calais (1824-1830). Un almanach royal de 1824 le donne, comme député, rue de Grenelle-Saint-Germain 126, et préfet résidant à Beauvais.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Marie Charlotte Ursule LE FORT (PN0013) — 1806 — *non vérifié* [A0171] ; lieu inconnu\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0014.\n", "PN0015": "# Antoine DUBART\n\n*mentionné dans un acte de Alexandre DUBART*\n\n## En bref\n\nAntoine Dubart n'apparaît qu'une fois, en l'an VIII (1799), au Quesnel : il est marchand, âgé de d'une trentaine d'années, et sert de témoin à la naissance de Charles Alexandre Éloi Dubart, fils de Jean Alexandre Dubart et de Josephine Sallart, dans un village où, selon l'abbé Leroy, presque tous les métiers de la campagne étaient représentés. L'acte ne dit pas ce qui le lie à l'enfant ou à son père : parent proche ou simple homonyme, on ne sait. …\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0015.\n", "PN0016": "# Marie Jean-Baptiste Charles François Léonor Augustin LE FORT\n\n*mentionné dans un acte de Alexandre DUBART*\n\n## En bref\n\nMarie Jean-Baptiste Charles François Léonor Augustin Le Fort, seigneur du Quesnel, épouse Marie-Charlotte-Alexandrine Dufresne : leur contrat est inscrit au registre d'insinuation de 1781, dont la date exacte, le lieu et les parents ne sont pas donnés. En 1789, un « Lefort du Quesnel, chevalier, seigneur du lieu » figure au rôle des privilégiés, mais son identité avec Léonor Augustin n'est pas établie.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Marie Charlotte Alexandrine DUFRESNE (PN0017) — 1781 — *partiellement vérifié* [A0173] ; lieu inconnu\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0016.\n", "PN0017": "# Marie Charlotte Alexandrine DUFRESNE\n\n*mentionné dans un acte de Alexandre DUBART*\n\n## En bref\n\nMarie-Charlotte-Alexandrine Dufresne épouse Léonor Augustin Le Fort, seigneur du Quesnel ; le contrat est inscrit au registre d'insinuation de 1781, sans date précise ni mention de ses parents. Selon l'abbé Leroy (1923), elle est arrêtée avec son mari et sa fille en février 1794, puis libérée après des pétitions. D'après Darsy, une Marie-Charlotte-Alexandrine Dufresne et sa tante Marie-Anne entrent à la maison d'arrêt de la Providence, à Amiens, le 17 février 1794 ; l'identité avec Mme Le Fort repose sur les prénoms seulement.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Marie Jean-Baptiste Charles François Léonor Augustin LE FORT (PN0016) — 1781 — *partiellement vérifié* [A0173] ; lieu inconnu\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0017.\n", "PN0018": "# Marguerite Léonore DE HÉE [?]\n\n*personne citée dans l'enquête*\n\n## En bref\n\nMarguerite-Léonore de Hée (lecture incertaine), dame du Hamel, est veuve en 1771-1774 de Jean-Baptiste-Barthélemy-François Lefort, écuyer, seigneur du Quesnel et de Saint-Mard : la date retenue est celle de la saisine du 14 avril 1774. Son lien avec Léonor Augustin Le Fort n'est pas dit. On ne sait rien d'autre d'elle.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Jean-Baptiste Barthélémy LE FORT (PN0012) — date et lieu inconnus (aucun acte de mariage dans la base ; union attestée par [A0174])\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0018.\n", "PN0019": "# Louis LE FORT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nLouis Lefort, chevalier, seigneur du Hamel, de Frémanoir et d'autres lieux, demeure au château du Hamel en 1784-1785. Son lien avec un « Jean Louis Le Fort, 48 ans, Hamel sous Corbie », cité en 1804, et avec les Le Fort du Quesnel n'est pas établi ; il peut s'agir d'homonymes. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0019.\n", "PN0020": "# Jean DUBART\n\n*personne citée dans l'enquête*\n\n## En bref\n\nUn Jean, fils de Charles Dubar et de Catherine Molin, sa femme, est baptisé à Elincourt-Sainte-Marguerite un 25 décembre ; l'année n'est pas lue et l'orthographe est « Dubar ». Le parrain est Louis Le Maire, la marraine Jeanne Butin (lecture incertaine), tous deux de la paroisse ; le parrain signe, la marraine fait une marque. L'année 1685, donnée par le nom d'un fichier familial, n'est pas lisible sur l'image et ne doit pas être tenue pour établie.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Baptême** : date inconnue ; lieu : Elincourt-Sainte-Marguerite, Oise — *partiellement vérifié* [A0262]\n- **Parents** : Charles DUBAR (PN0058) et Catherine MOLIN (PN0059) — *partiellement vérifié* [A0262]\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0020.\n", "PN0021": "# Jean DUBART\n\n*père de Jean DUBART*\n\n## En bref\n\nJean Dubart est cordonnier à Elincourt-Sainte-Marguerite. Il y est inhumé le 15 septembre 1756 ; l'acte le dit décédé la veille, muni des sacrements, âgé de « soixante et dix ans ou environ », ce qui suggère une naissance vers 1686. Assiste à l'inhumation Jean Dubart, « notre clerc », dit fils du défunt ; l'acte ne nomme ni l'épouse ni le père du défunt.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0021.\n", "PN0022": "# Pierre MOLIEN\n\n*personne citée dans l'enquête*\n\n## En bref\n\nPierre Molien, jardinier, est présent à l'inhumation d'un Jean Dubart à Elincourt-Sainte-Marguerite en 1756 ; l'acte le dit gendre du défunt, ce qui implique une fille de celui-ci, non nommée. Son âge, sa famille et la suite de sa vie ne sont pas connus.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0022.\n", "PN0023": "# Alphonse DURSON\n\n*personne citée dans l'enquête*\n\n## En bref\n\nAlphonse Durson est charpentier et habite Moreuil en 1859. Il a 39 ans quand il déclare, avec un autre déclarant, le décès de sa mère, Marie Charlotte Dubart, épouse Durson, à Moreuil le 4 juillet 1859. Il est donc le neveu de Louis Charles Ambroise Dubart, selon cet acte. Sa naissance, vers 1820, est à rechercher (Le Quesnel ou Plessier-Rozainvillers) ; on ne connaît ni son épouse éventuelle, ni ses enfants, ni ses frères et sœurs.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : Marie Josèphe Charlotte Alexandrine DUBART (PN0009) — *vérifié* [A0291] ; l'autre parent est inconnu\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0023.\n", "PN0024": "# [prénom non donné] ORSAY\n\n*personne citée dans l'enquête*\n\n## En bref\n\nUne « Madame veuve Orsay » est l'une des expéditrices du faire-part de 1918 annonçant la mort de Marie Félicie Rignault, sans lien indiqué. Le nom Orsay est celui de la mère adoptive de Jeanne Augustine, mais le rapprochement n'est pas démontré par ce document. Son prénom et son identité restent à établir.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0024.\n", "PN0025": "# Eugène RIGNAULT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nEugène Rignault n'apparaît que dans le faire-part de décès de Marie Félicie Rignault, veuve Dubart, en 1918 : « Monsieur et Madame Eugène Rignault et leurs enfants » y sont dits ses frère et belle-sœur, lien partiellement vérifié. L'arbre familial ne le connaît pas, et l'on ignore son âge, son lieu de naissance, sa résidence, ainsi que le nom de sa femme et de ses enfants.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0025.\n", "PN0026": "# Maurice DUBART\n\n*personne citée dans l'enquête*\n\n## En bref\n\nMaurice Dubart n'apparaît que dans le faire-part de décès de Marie Félicie Rignault, veuve Dubart, en 1918 : on y lit « Monsieur et Madame Maurice Dubart et leurs enfants, ses neveu et nièce ». La parenté est donnée à demi-mot et reste d'une fiabilité faible. Il est peut-être le même que Maurice Charles Dubart (PN0054), fils de Charles (1829-1890) et donc neveu d'Edmond, mais aucun acte ne relie les deux mentions : c'est une hypothèse. On ne sait rien de sa naissance, de son mariage ni de son décès.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0026.\n", "PN0027": "# Mathilde Emilie CINOT [?]\n\n*personne citée dans l'enquête*\n\n## En bref\n\nMathilde Emilie est nommée dans l'acte de décès de son mari, Charles Dubart, à Paris 17e, en juin 1890. L'acte la dit âgée de 59 ans, sans profession, domiciliée avec lui rue Dulong 41. Son nom de famille se lit « Cinot », mais cette lecture est douteuse et doit être revue sur l'image. Hypothèse : elle serait Mathilde Émilie Tissot, née le 14/11/1831 à Paris, qui épouse Charles Dubart le 26/07/1860 ; les prénoms, l'époux et l'âge concordent, mais la fusion n'est pas faite. Elle serait alors la belle-sœur d'Edmond Dubart. On ne sait rien de plus de sa vie, ni de sa date de décès.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Charles Alfred DUBART (P5762) — date et lieu inconnus (aucun acte de mariage dans la base ; union attestée par [A0378])\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0027.\n", "PN0028": "# Charles DUBART\n\n*personne citée dans l'enquête*\n\n## En bref\n\nUn Charles Dubart, âgé de 28 ans, employé, domicilié rue Dulong 41 à Paris, déclare en juin 1890 le décès de Charles Dubart, en qualité de fils. Sa naissance vers 1862 est seulement déduite de l'âge. Elle pourrait se rapprocher d'une entrée de table décennale « Maurice Ch. 3 oct. 1861 », dont la lecture est douteuse. Selon l'hypothèse de la base, il pourrait être le frère de Maurice Charles Dubart (PN0054), mais cela n'est pas vérifié. Il serait le neveu d'Edmond Dubart. On ne connaît ni mariage, ni enfants, ni date de décès.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : Charles Alfred DUBART (P5762) — *partiellement vérifié* [A0379] ; l'autre parent est inconnu\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0028.\n", "PN0029": "# Jules CASTERAN [?]\n\n*témoin dans un acte de René DUBART*\n\n## En bref\n\nJules de Casteran, nom à relire, est le second témoin de la déclaration de naissance de René Dubart, à Paris 2e, en janvier 1900. L'acte le dit âgé de 53 ans, propriétaire, domicilié rue Richard-Lenoir n° 12 (lecture probable). Son lien avec la famille n'est pas indiqué, et rien n'indique qu'il soit parent de Léon ou d'Edmond. On ne sait rien d'autre de lui.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : inconnu (aucun conjoint dans la base)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0029.\n", "PN0030": "# Louis Auguste LEBLANC\n\n*personne citée dans l'enquête*\n\n## En bref\n\nLouis Auguste Leblanc est né le 25/08/1876 à Connantre (Marne). Il est le fils de Germain Alcidalis Leblanc et d'Hortense Appoline Oudot, domiciliés à Connantre (la lecture « Alcidalis » est probable). Sa feuille matricule (classe 1896, canton de Fère-Champenoise) le dit garçon de café, engagé volontaire pour trois ans au 106e régiment d'infanterie, où il devient caporal puis sergent ; la date d'engagement reste à relire.\n\n## Faits clés\n\n- **Naissance** : 25/08/1876, Connantre — *vérifié* [A0423]\n- **Parents** : Germain Alcidalis LEBLANC (PN0032) et Hortense Appoline OUDOT (PN0033) — *vérifié* [A0424]\n- **Mariage** : avec Marguerite Elisabeth Marie Eléonore BELLOY (PN0031) — 09/05/1900, Épernay — *vérifié* [A0422]\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0030.\n", "PN0031": "# Marguerite Elisabeth Marie Eléonore BELLOY\n\n*personne citée dans l'enquête*\n\n## En bref\n\nMarguerite Elisabeth Marie Eléonore Belloy est née le 20/08/1882 au Mesnil-sur-Oger (Marne) ; la date a été corrigée à la relecture (1882, non 1892), mais l'acte de naissance lui-même n'a pas été lu. Elle est la fille d'Auguste-Alfred Belloy, propriétaire à Jandun (Ardennes), et de Louise Adèle Charlemagne, modiste, divorcés. Le divorce est prononcé le 15/12/1898 par le tribunal civil de Charleville, au profit de l'épouse, avec garde des enfants.\n\n## Faits clés\n\n- **Naissance** : 20/08/1882, Le Mesnil-sur-Oger — *vérifié* [A0427]\n- **Parents** : Auguste Alfred BELLOY (PN0034) et Louise Adèle CHARLEMAGNE (PN0035) — *vérifié* [A0428]\n- **Mariage** : avec Louis Auguste LEBLANC (PN0030) — 09/05/1900, Épernay — *vérifié* [A0422]\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0031.\n", "PN0032": "# Germain Alcidalis LEBLANC\n\n*personne citée dans l'enquête*\n\n## En bref\n\nGermain Alcidalis Leblanc est le père de Louis Auguste Leblanc ; le prénom « Alcidalis » est une lecture probable. En 1900, il est domicilié à Connantre (Marne) et il est présent au mariage de son fils à Épernay, où il signe « A. Leblanc ». L'acte le dit bonnetier, lecture probable (une première lecture donnait tonnelier). Il est marié à Hortense Appoline Oudot. On ne sait rien de sa naissance, de son mariage ni de son décès.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Hortense Appoline OUDOT (PN0033) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0032.\n", "PN0033": "# Hortense Appoline OUDOT\n\n*personne citée dans l'enquête*\n\n## En bref\n\nHortense Appoline Oudot est la mère de Louis Auguste Leblanc et l'épouse de Germain Alcidalis Leblanc ; en 1900 ils sont domiciliés à Connantre (Marne). Elle signe « Hortense Oudot » à l'acte de mariage de son fils. Elle est sans profession à Connantre en 1900. Le dénombrement de Châlons-sur-Marne en 1901 cite dans le ménage de son fils une Hortense Leblanc, 47 ans, « mère », couturière ; l'identification repose sur le prénom et la parenté, non sur l'état civil. Ses dates de naissance et de décès sont inconnues.\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Germain Alcidalis LEBLANC (PN0032) — date et lieu inconnus (aucun acte de mariage dans la base ; union connue par la filiation d'un enfant)\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0033.\n", "PN0034": "# Auguste Alfred BELLOY\n\n*personne citée dans l'enquête*\n\n## En bref\n\nAuguste-Alfred Belloy est propriétaire à Jandun (Ardennes) en 1900. Il est le père de Marguerite Belloy et a été marié à Louise Adèle Charlemagne. Leur divorce est prononcé le 15/12/1898 par le tribunal civil de Charleville, au profit de l'épouse, avec garde des enfants, qui ne sont pas nommés. Absent au mariage de sa fille en 1900, il n'a pas donné son consentement ; l'officier d'état civil passe outre, après un acte notarié du 24/04/1900 attestant qu'il a été sollicité. L'acte ne lui prête aucune intention. …\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Louise Adèle CHARLEMAGNE (PN0035) — date et lieu inconnus (aucun acte de mariage dans la base ; union attestée par [A0429])\n- **Décès** : inconnu (rien dans la base)\n\n\n## Pour aller plus loin\n\nLa page complète, avec le récit, la famille, les documents et les preuves : voir PN0034.\n", "PN0035": "# Louise Adèle CHARLEMAGNE\n\n*personne citée dans l'enquête*\n\n## En bref\n\nLouise Adèle Charlemagne est modiste en 1900. Elle est la mère de Marguerite Belloy et a été mariée à Auguste-Alfred Belloy, dont elle est divorcée depuis le jugement du 15/12/1898, prononcé à son profit avec garde des enfants. En mai 1900, elle vit à Épernay, 13 rue Saint-Martin, avec sa fille mineure, dont elle consent au mariage. Sa famille semble être du Mesnil-sur-Oger : Clovis Charlemagne, « aïeul maternel » de la mariée, et Gustave Charlemagne, oncle maternel, sont témoins. …\n\n## Faits clés\n\n- **Naissance** : inconnu (rien dans la base)\n- **Parents** : inconnus (aucune filiation dans la base)\n- **Mariage** : avec Auguste Alfred BELLOY (PN0034) — date et lieu in
